function rebuildBalls(){
 let n=Math.max(1,Math.min(4,+builder.ballCount||1)), valid=builder.players.map((p,i)=>({p,i})).filter(x=>x.p.name.trim());
 builder.balls=Array.from({length:n},(_,bi)=>({no:bi+1,playerIndexes:[],markerIndex:null}));
 valid.forEach((x,j)=>builder.balls[j%n].playerIndexes.push(x.i));
 builder.balls.forEach(b=>b.markerIndex=b.playerIndexes[0]??null)
}

 if(!Array.isArray(builder.balls)||builder.balls.length!==builder.ballCount)rebuildBalls();
 let used=new Set();
 builder.balls.forEach(b=>{b.playerIndexes=(b.playerIndexes||[]).filter(i=>i>=0&&i<builder.players.length&&!used.has(i)&&(used.add(i)||true));if(!b.playerIndexes.includes(b.markerIndex))b.markerIndex=b.playerIndexes[0]??null});

function hc(p,hi){let c=p.course_handicap,idx=H[hi][2];if(c>=0)return Math.floor(c/18)+(c%18>=idx?1:0);let give=-c;return idx>=19-give?-1:0}

function parseHcp(raw){let s=String(raw??"").trim().replace(",",".");if(!s)return NaN;let golfPlus=s.startsWith("+"),n=Number(s);if(!Number.isFinite(n))return NaN;return golfPlus?-Math.abs(n):n}

function courseHandicap(raw,rating,tee){let hi=typeof raw==="number"?raw:parseHcp(raw),td=teeData(rating,tee);if(!Number.isFinite(hi)||!td)return null;return Math.round(hi*(td.slope/113)+(td.cr-COURSE.par))}

function dur(a,b){if(!a||!b)return null;let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}
function elapsed(){let c=state.competition;if(!c?.started_at)return "0:00";return dur(c.started_at,c.finished_at||new Date().toISOString())}
function clockBar(){return state.competition?.started_at?`<div class="clockbar"><span>⏱ Rondtid</span><b class="liveClock">${elapsed()}</b></div>`:""}
function timeSummary(){let c=state.competition;if(!c?.started_at)return"";let f=c.halfway_at?dur(c.started_at,c.halfway_at):null,b=c.halfway_at&&c.finished_at?dur(c.halfway_at,c.finished_at):null;return `<div class="card"><div class="title">⏱ Rondtid</div><div class="row"><span class="grow">Totalt</span><b>${elapsed()}</b></div>${f?`<div class="row"><span class="grow">Första 9</span><b>${f}</b></div>`:""}${b?`<div class="row"><span class="grow">Sista 9</span><b>${b}</b></div>`:""}</div>`}
function holesPlayed(p){return state.scores.filter(s=>s.player_id===p.id).length}
function joined(){return state.players.filter(p=>p.claimed_token).length}

function playerProgressResult(p){
 let rows=state.scores.filter(s=>s.player_id===p.id&&s.strokes!=null).sort((a,b)=>a.hole-b.hole),holes=rows.length;
 if(!holes)return {holes:0,text:"–",cls:"resultEven"};
 if(state.competition?.mode==="stableford"){
  let total=rows.reduce((sum,s)=>sum+stableford(p,s.hole,s.strokes),0),d=total-2*holes;
  return {holes,text:`${d===0?"E":(d>0?"+":"")+d} (${total} p)`,cls:d>0?"resultGood":d<0?"resultBad":"resultEven"}
 }
 let total=rows.reduce((sum,s)=>sum+s.strokes,0),par=rows.reduce((sum,s)=>sum+(HOLES.find(h=>h[0]===s.hole)?.[1]||0),0),d=total-par;
 return {holes,text:`${d===0?"E":(d>0?"+":"")+d} (${total} slag)`,cls:d<0?"resultGood":d>0?"resultBad":"resultEven"}
}
function ranking(){let pts=state.competition?.mode!=="stroke"&&state.metric==="points";return [...state.players].sort((a,b)=>pts?(points(b)-points(a)||a.hcp-b.hcp):(netToPar(a)-netToPar(b)||a.hcp-b.hcp))}
function val(p){return state.competition?.mode!=="stroke"&&state.metric==="points"?`${points(p)} p`:fmt(netToPar(p))}
function sideResult(h){return state.side.find(x=>x.hole===h&&x.kind===side[h]?.kind)}
function myBallNo(){return state.me?.ball_no||1}
function ballPlayers(ballNo=myBallNo()){return state.players.filter(p=>(p.ball_no||1)===ballNo)}
function ballProgress(ballNo=myBallNo()){return state.ballProgress.find(b=>b.ball_no===ballNo)||{ball_no:ballNo,current_hole:state.competition?.current_hole||1,status:"playing"}}
function allScored(h,ballNo=myBallNo()){let ps=ballPlayers(ballNo);return ps.length>0&&ps.every(p=>scoreFor(p.id,h)!=null)}
function ballsOverview(){let nos=[...new Set(state.players.map(p=>p.ball_no||1))].sort((a,b)=>a-b);return nos.map(n=>({no:n,players:ballPlayers(n),progress:ballProgress(n)}))}
function hcpLabel(p,i){let x=hc(p,i);return x<0?`+${Math.abs(x)}`:`${x}`}
function birdies(p){return H.filter((x,i)=>{let s=scoreFor(p.id,i+1);return s!=null&&s<x[1]}).length}
function bogeys(p){return H.filter((x,i)=>{let s=scoreFor(p.id,i+1);return s!=null&&s>x[1]}).length}
function remainingSides(){return Object.keys(side).filter(h=>!sideResult(+h)).length}

function roundStatus(){if(!state.me||!state.competition||state.competition.status!=="active")return"";return `<div class="card"><div class="title">Din rondstatus</div><div class="roundstatus"><div class="stat"><span class="muted">Hål</span><b>${currentHole()}/18</b></div><div class="stat"><span class="muted">Resultat</span><b>${points(state.me)} p · ${fmt(netToPar(state.me))}</b></div><div class="stat"><span class="muted">Tagna / tappade</span><b>◯ ${birdies(state.me)} · □ ${bogeys(state.me)}</b></div><div class="stat"><span class="muted">Sidotävlingar kvar</span><b>${remainingSides()}</b></div></div></div>`}


async function reload(){
 if(!joinCode){render();return}
 let {data:c}=await sb.from("competitions").select("*").eq("join_code",joinCode).maybeSingle();if(!c){render();return}
 state.competition=c;
 let [{data:p},{data:s},{data:sr},{data:bp},{data:adm}]=await Promise.all([
  sb.from("players").select("*").eq("competition_id",c.id).order("sort_order"),
  sb.from("scores").select("*").eq("competition_id",c.id),
  sb.from("side_results").select("*").eq("competition_id",c.id),
  sb.from("ball_progress").select("*").eq("competition_id",c.id).order("ball_no"),
  sb.rpc("alpha_is_admin",{p_join_code:joinCode,p_actor_token:token})
 ]);
 state.players=p||[];state.scores=s||[];state.side=sr||[];state.ballProgress=bp||[];state.isAdmin=adm===true;side=sideFromSettings(c.settings);if(c.mode==="stroke")state.metric="strokes";
 state.me=state.players.find(p=>p.id===localStorage.fc07_player)||null;
 subscribe();render();
}
function subscribe(){
 if(!state.competition)return;if(channel)sb.removeChannel(channel);
 const cid=state.competition.id;
 const upsert=(arr,row,keys)=>{let i=arr.findIndex(x=>keys.every(k=>x[k]===row[k]));if(i>=0)arr[i]={...arr[i],...row};else arr.push(row)};
 channel=sb.channel("fc-"+cid)
 .on("postgres_changes",{event:"*",schema:"public",table:"scores",filter:`competition_id=eq.${cid}`},e=>{if(e.eventType==="DELETE")state.scores=state.scores.filter(x=>!(x.player_id===e.old.player_id&&x.hole===e.old.hole));else upsert(state.scores,e.new,["player_id","hole"]);render()})
 .on("postgres_changes",{event:"*",schema:"public",table:"side_results",filter:`competition_id=eq.${cid}`},e=>{if(e.eventType!=="DELETE")upsert(state.side,e.new,["hole","kind"]);render()})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:`competition_id=eq.${cid}`},e=>{upsert(state.players,e.new,["id"]);state.me=state.players.find(p=>p.id===localStorage.fc07_player)||null;render()})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"competitions",filter:`id=eq.${cid}`},e=>{state.competition={...state.competition,...e.new};render()})
 .on("postgres_changes",{event:"*",schema:"public",table:"ball_progress",filter:`competition_id=eq.${cid}`},e=>{if(e.eventType!=="DELETE")upsert(state.ballProgress,e.new,["competition_id","ball_no"]);render()})
 .subscribe(x=>{state.connected=x==="SUBSCRIBED";render()});
}

function customSideSave(){
 const x=builder.editSide;
 if(!x)return info("Sidotävlingen saknas","Öppna Egen sidotävling igen och försök.");
 const name=(x.name||"").trim(),hole=Number(x.hole),rule=(x.rule||"").trim();
 if(!name)return info("Namn saknas","Ge den egna sidotävlingen ett namn.");
 if(!Number.isInteger(hole)||hole<1||hole>18)return info("Hål saknas","Välj vilket hål sidotävlingen gäller.");
 builder.sides=[...builder.sides,{kind:"custom",name,hole,rule}];

let activeHcpId=null,activeHcpDraft="";
function hcpPadOpen(id){
 activeHcpId=id;
 let input=document.getElementById(id);
 if(!input)return;
 activeHcpDraft=input.value||"";
 document.getElementById("hcpKeyValue").textContent=activeHcpDraft||"HCP";
 document.getElementById("hcpKeyOverlay").classList.add("show");
}
function hcpRefresh(){document.getElementById("hcpKeyValue").textContent=activeHcpDraft||"HCP"}
function hcpKey(k){
 let v=activeHcpDraft||"";
 if(k==="⌫")v=v.slice(0,-1);
 else if(k==="Rensa")v="";
 else if(k==="+")v=v.startsWith("+")?v.slice(1):"+"+v.replace(/\+/g,"");
 else if(k===","){if(!v.includes(",")&&!v.includes("."))v+=(v&&v!=="+")?",":"0,"}
 else{
   if(v==="0"&&k!=="0")v=k;
   else if(v==="+0"&&k!=="0")v="+"+k;
   else v+=k;
 }
 activeHcpDraft=v;
 hcpRefresh();
}
function hcpPadConfirm(){
 let input=document.getElementById(activeHcpId);
 if(!input)return hcpPadCancel();
 let parsed=parseHcp(activeHcpDraft);
 if(activeHcpDraft&&(!Number.isFinite(parsed)||parsed<-10||parsed>54))return info("Kontrollera HCP","Ange ett giltigt handicap mellan +10,0 och 54,0.");
 input.value=activeHcpDraft;
 input.dispatchEvent(new Event("input",{bubbles:true}));
 document.getElementById("hcpKeyOverlay").classList.remove("show");
 activeHcpId=null;activeHcpDraft="";
}
function hcpPadCancel(){
 document.getElementById("hcpKeyOverlay").classList.remove("show");
 activeHcpId=null;activeHcpDraft="";
}

function saveSideBuilder(){
 const x=builder.editSide;
 if(!x)return alert("Sidotävlingen kunde inte läsas. Försök igen.");
 const nameEl=document.getElementById("sideName");
 const holeEl=document.getElementById("sideHole");

 delete builder.editSide;

 if(!state.competition)return `<div class="card hero"><div class="muted">SCORE</div><div class="title">Ingen aktiv rond</div><p>Starta en ny rond för att registrera score.</p></div><button class="btn primary" onclick="state.page='home';state.sub='today';render()">Starta ny rond</button>`;
 if(!state.me)return identity();
 if(state.competition.status==="finished"&&state.sub!=="card")return `<div class="card hero"><div class="muted">ROND AVSLUTAD</div><div class="title">Ingen aktiv rond</div><p>Scoren är låst. Du kan fortfarande gå tillbaka och läsa scorekort och resultat.</p></div><button class="btn primary" onclick="state.sub='card';render()">Visa scorekort</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="state.page='results';state.sub='final';render()">Visa resultat</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="newRound()">Starta ny rond</button>${state.isAdmin?`<div class="card"><div class="title">Behöver du rätta ett misstag?</div><div class="muted">Återöppning är en admin-/teståtgärd och kräver extra bekräftelse.</div><button class="btn danger" style="width:100%;margin-top:8px" onclick="reopenRound()">Återöppna rond</button></div>`:""}`;
 if(state.sub==="card"){let ord=[...ballPlayers()].sort((a,b)=>(a.id===state.me.id?-1:b.id===state.me.id?1:0));return `<div class="card"><div class="headline"><div><div class="title">Scorekort</div><div class="muted">Tryck på en spelare. Scorekortet finns även innan score registrerats.</div></div>${seg()}</div>${ord.map(p=>`<div><div class="row linkrow ${state.me.id===p.id?'me':''}" onclick="togglePlayer('${p.id}')"><span class="grow"><b>${p.name}</b>${state.me.id===p.id?' <span class="chip">DU</span>':''}</span><b>${val(p)}</b><span>⌄</span></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`).join("")}</div>`}
 let h=viewedHole(),curHole=currentHole(),hd=H[h-1],editing=h!==curHole;
 return `${clockBar()}${holeNav()}${guide(h)}<div class="card"><div class="title">${editing?`Rätta score · hål ${h}`:"Registrera score"}</div><div class="muted">${editing?`Du rättar ett annat hål. Aktuellt hål ${curHole} flyttas inte.`:"Par är markerat. Ovanligare resultat anges med +."}</div>${ballPlayers().map(p=>{let cur=scoreFor(p.id,h);return `<div class="player"><div class="phead"><b>${p.name}</b><span class="liveScore">${fmt(netToPar(p,h-1))} · ${points(p,h-1)} p</span>${state.me.id===p.id?'<span class="chip">DU</span>':''}</div><div class="scroller">${Array.from({length:hd[1]+5},(_,i)=>i+1).map(n=>`<button class="${n===hd[1]?'parBtn':''} ${cur===n?'sel':''}" onclick="setScore('${p.id}',${h},${n})">${cur===n?mark(n,hd[1]):n}</button>`).join("")}<button onclick="manual('${p.id}',${h})">＋</button></div></div>`}).join("")}</div>
 ${allScored(h)?`<div class="notice ok"><b>${editing?"✓ Ändringen är redo":"✓ Alla spelare registrerade"}</b><br>${editing?`Bekräfta för att återgå till hål ${curHole}.`:"Snabbkolla innan du går vidare."}</div><button class="btn primary" style="margin-top:8px" onclick="confirmViewedHole()">${editing?"Bekräfta ändring ✓":`Bekräfta hål ${h} →`}</button>`:`<button class="btn primary" onclick="info('Kan inte bekräfta hålet','Score saknas för minst en spelare. Fyll i alla scorer innan du går vidare.')" style="opacity:.55">Fyll i alla spelare</button>`}
 <div class="card"><div class="row"><span class="grow"><b>Rondalternativ</b><div class="muted">Om ronden inte kan slutföras.</div></span><button class="btn danger" onclick="abortWhole()">Avsluta rond</button></div></div>`;
}
function manual(pid,h){let v=prompt("Ange score");if(v&&!isNaN(v)&&+v>0)setScore(pid,h,+v)}
function sideCompetitionList(reveal=false){
 let entries=Object.entries(side).sort((a,b)=>+a[0]-+b[0]);
 if(!entries.length)return `<div class="empty">Inga sidotävlingar.</div>`;
 return entries.map(([h,e])=>{
  let r=sideResult(+h),winner=r?.player_id?state.players.find(p=>p.id===r.player_id)?.name:null;
  if(!reveal)return `<div class="row"><span class="grow"><b>${e.kind==="nearest"?"🎯":e.kind==="longest"?"💥":"✏️"} ${e.name}</b><div class="muted">Hål ${h}</div></span><b class="muted">Resultat dolt</b></div>`;
  let value=!r?"⚠ Saknas":r.no_winner?"Ingen vinnare":`${winner||"–"}${r.distance_m!=null?` · ${String(r.distance_m).replace(".",",")} m`:""}`;
  return `<div class="row linkrow" onclick="sidePopup(${h})"><span class="grow"><b>${e.kind==="nearest"?"🎯":e.kind==="longest"?"💥":"✏️"} ${e.name} <button class="infoBtn" onclick="event.stopPropagation();sideInfo(${h})">i</button></b><div class="muted">Hål ${h} · ${r?"Tryck för att ändra":"Ej registrerad"}</div></span><b>${value}</b></div>`
 }).join("")
}
function resultBalls(){return `<div class="card"><div class="title">Bollar</div><div class="muted">Tryck på en boll för att se deltagarna.</div>${ballsOverview().map(b=>`<div class="ballSummary" onclick="state.liveBall=state.liveBall===${b.no}?null:${b.no};render()"><div class="row"><span class="grow"><b>Boll ${b.no}</b><div class="muted">${b.progress.status==="finished"?"Klar":`Hål ${b.progress.current_hole}`}</div></span><b>${state.liveBall===b.no?"⌃":"⌄"}</b></div>${state.liveBall===b.no?`<div>${b.players.map(p=>{let r=playerProgressResult(p);return `<div class="row"><span class="grow"><span class="onlineDot ${p.claimed_token?"on":""}"></span>${p.name}<div class="muted">${r.holes?`Efter ${r.holes} hål`:"Ingen score ännu"}</div></span><span class="${r.cls}">${r.text}</span></div>`}).join("")}</div>`:""}</div>`).join("")}</div>`}
function resultLeaderboard(final=false){let ord=ranking();return `<div class="card"><div class="title">${final?"Slutresultat":"Leaderboard"}</div><div class="muted">${final?"Slutlig individuell ställning.":"Individuell ställning i hela tävlingen."}</div>${ord.map((p,i)=>{let r=playerProgressResult(p);return `<div><div class="row linkrow ${state.me&&state.me.id===p.id?'me':''}" onclick="togglePlayer('${p.id}')"><b>${i+1}</b><span class="grow"><b>${p.name}</b>${state.me&&state.me.id===p.id?' <span class="chip">DU</span>':''}<div class="muted">${final?"18 hål":r.holes?`Efter ${r.holes} hål`:"Inte startat"}</div></span><span class="${r.cls}">${r.text}</span></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`}).join("")}</div>`}
function resultsPage(){
 if(!state.competition)return `<div class="card"><div class="title">Resultat</div><div class="muted">Ingen tävling är öppen.</div></div>`;
 let finished=state.competition.status==="finished";
 if(!finished){
  if(state.sub==="leader")return resultLeaderboard(false);
  if(state.sub==="sides")return `<div class="card"><div class="title">Sidotävlingar</div><div class="muted">Ni ser vilka sidotävlingar som spelas. Resultaten avslöjas när alla bollar är klara.</div>${sideCompetitionList(false)}</div>`;
  return resultBalls();
 }
 if(state.sub==="scorecards")return `<div class="card"><div class="title">Scorekort</div><div class="muted">Tryck på en spelare för att öppna scorekortet.</div>${ranking().map(p=>`<div><div class="row linkrow" onclick="togglePlayer('${p.id}')"><span class="grow"><b>${p.name}</b><div class="muted">Boll ${p.ball_no||1}</div></span><span>⌄</span></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`).join("")}</div>`;
 if(state.sub==="sides")return `<div class="card"><div class="title">Sidotävlingar</div><div class="muted">Nu är sidotävlingarnas resultat synliga för alla.</div>${sideCompetitionList(true)}</div>`;
 return `<div class="card hero"><div class="muted">SLUTRESULTAT</div><div style="font-size:27px;font-weight:900">Resultat</div><div>${modeName()}</div></div>${timeSummary()}${resultLeaderboard(true)}`;
}
function morePage(){return `<div class="card"><div class="title">Mina tävlingar</div><div class="muted">Den här tävlingen kan återöppnas via sin länk.</div></div>${state.competition&&state.competition.status==="active"&&state.isAdmin?`<div class="card"><div class="title">Rondhantering</div><div class="muted">Här avslutar du hela ronden om den inte kan slutföras.</div><button class="btn danger" style="width:100%;margin-top:10px" onclick="abortWhole()">Avsluta hela ronden</button></div>`:""}<div class="card"><div class="row"><span class="grow">Tourställning</span><b>Kommer i Tour-läge</b></div></div>`}
async function abortWhole(){if(!state.isAdmin)return info("Endast admin","Bara admin kan avsluta hela tävlingen.");if(!confirm("Avsluta hela ronden i förtid? Registrerade scorer sparas och scoreinmatningen låses."))return;await sb.rpc("alpha_finish_competition",{p_join_code:joinCode,p_actor_token:token});await reload();state.page="results";state.sub="final";render()}
async function reopenRound(){
 if(!state.isAdmin)return info("Endast admin","Bara admin kan återöppna tävlingen.");
 if(!confirm("Återöppna den avslutade ronden? Gör bara detta om ronden avslutades av misstag."))return;
 if(!confirm("Bekräfta igen: scoreinmatningen blir aktiv på nytt."))return;
 let {data,error}=await sb.rpc("alpha_reopen_competition",{p_join_code:joinCode,p_actor_token:token});
 if(error||!data)return info("Kunde inte återöppna","Ronden kunde inte återöppnas. Kontrollera att SQL-uppdateringen för 0.8.1 är installerad.");
 await reload();state.page="score";state.sub="register";render();
}

function headsUp(h){toast((side[h].kind==="nearest"?"🎯 ":"💥 ")+side[h].name,side[h].pre)}
function toast(t,txt){pop.innerHTML=`<div class="title">${t}</div><p>${txt}</p><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt</button>`;pop.classList.add("show")}
function halftime(){let ord=ranking();pop.innerHTML=`<div class="title">⛳ Halvtid – 9 hål</div>${state.competition?.started_at?`<div class="notice ok"><b>⏱ Första 9: ${state.competition.halfway_at?dur(state.competition.started_at,state.competition.halfway_at):elapsed()}</b></div>`:""}<p class="muted">Så här ser läget ut just nu.</p>${ord.map((p,i)=>`<div class="row ${state.me&&state.me.id===p.id?'me':''}"><b>${i+1}</b><span class="grow">${p.name}</span><b>${val(p)}</b></div>`).join("")}<div class="segment" style="margin:10px 0"><button class="${state.metric==='strokes'?'on':''}" onclick="state.metric='strokes';halftime()">SLAG</button><button class="${state.metric==='points'?'on':''}" onclick="state.metric='points';halftime()">POÄNG</button></div><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt till hål 10 →</button>`;pop.classList.add("show")}
function sidePopup(h){if(!state.me)return info("Sidotävling","Du måste vara ansluten som spelare för att registrera sidotävlingen.");let e=side[h],r=sideResult(h)||{};pop.innerHTML=`<div class="title">${e.kind==="nearest"?"🎯":"💥"} ${e.name}</div><p><b>Vem vann?</b></p><select id="sidePlayer"><option value="">Välj spelare</option>${state.players.map(p=>`<option value="${p.id}" ${r.player_id===p.id?'selected':''}>${p.name}</option>`).join("")}</select><label class="muted">Avstånd (valfritt)</label><div class="unitInput"><input id="sideDist" inputmode="decimal" value="${r.distance_m??""}" placeholder="t.ex. 1,42"><span>m</span></div><label class="check"><input id="noWinner" type="checkbox" ${r.no_winner?'checked':''}><span><b>Ingen vinnare</b><br><span class="muted">Markera om sidotävlingen avslutades utan vinnare.</span></span></label><button class="btn primary" onclick="saveSide(${h})">Spara & fortsätt</button><button class="btn soft" style="width:100%;margin-top:7px" onclick="pop.classList.remove('show')">Fyll i senare</button>`;pop.classList.add("show")}
async function saveSide(h){if(!state.me)return info("Sidotävling","Du måste vara ansluten som spelare för att registrera sidotävlingen.");let none=noWinner.checked,pid=sidePlayer.value||null,raw=sideDist.value.trim(),dist=raw?+raw.replace(",","."):null;if(!none&&!pid)return alert("Välj vinnare, Ingen vinnare eller fyll i senare.");let {data,error}=await sb.rpc("alpha_set_side_result",{p_join_code:joinCode,p_actor_token:token,p_hole:h,p_kind:side[h].kind,p_player_id:pid,p_distance_m:dist,p_no_winner:none});if(error||!data)return alert("Kunde inte spara sidotävlingen.");pop.classList.remove("show");render()}

function tabsRender(){
 let finished=state.competition?.status==="finished";
 let a=state.page==="home"?[["today","Dagens upplägg"],["rules","Spelregler"]]:state.page==="score"?[["register","Registrera"],["card","Scorekort"]]:state.page==="results"?(finished?[["final","Slutresultat"],["scorecards","Scorekort"],["sides","Sidotävlingar"]]:[["balls","Bollar"],["leader","Leaderboard"],["sides","Sidotävlingar"]]):[["more","Mer"]];
 if(state.page==="home"&&state.sub==="finishedDetail"){tabs.innerHTML="";return}
 if(!a.some(x=>x[0]===state.sub))state.sub=a[0][0];
 tabs.innerHTML=a.map(x=>`<button class="${state.sub===x[0]?'on':''}" onclick="state.sub='${x[0]}';render()">${x[1]}</button>`).join("")
}
function nav(){bottom.innerHTML=[["home","🏆","Tävling"],["results","📊","Resultat"],["score","⛳","Score"],["more","•••","Mer"]].map(x=>`<button class="${state.page===x[0]?'on':''} ${x[0]==='score'?'scoreNav':''}" onclick="let was=state.page;state.page='${x[0]}';state.sub='';if('${x[0]}'==='score'&&was!=='score')state.viewedHole=currentHole();render()">${x[1]}<br>${x[2]}</button>`).join("")}
function render(){tabsRender();nav();main.innerHTML=state.page==="home"?home():state.page==="score"?scorePage():state.page==="results"?resultsPage():morePage()}
const main=document.getElementById("main"),bottom=document.getElementById("bottom"),tabs=document.getElementById("tabs"),pop=document.getElementById("pop"),overlay=document.getElementById("overlay"),infoModal=document.getElementById("infoModal"),hcpKeyOverlay=document.getElementById("hcpKeyOverlay");setInterval(()=>document.querySelectorAll(".liveClock").forEach(x=>x.textContent=elapsed()),30000);reload();render();
</script></body></html>
