<!doctype html> 
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#124b35"><title>Friendly Competition Alpha 0.6.3</title>
<style>
:root{--g:#124b35;--g2:#2e7654;--pale:#e8f1e9;--bg:#f3f5f0;--ink:#183126;--muted:#758079;--line:#e0e6df;--red:#bd403b;--blue:#2f67aa;--gold:#bd9330}
*{box-sizing:border-box}body{margin:0;background:#e7ece7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(#124b35,#103e2e);color:#fff;padding:14px 14px 11px}.brand{font-weight:900;font-size:18px}.tiny{font-size:11px;opacity:.7}
.tabs{display:flex;gap:7px;overflow:auto;margin-top:11px}.tabs button{border:0;border-radius:18px;padding:8px 11px;background:#ffffff18;color:white;font-weight:800;white-space:nowrap}.tabs .on{background:white;color:var(--g)}
main{padding:12px}.card{background:#fff;border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 3px 14px #1731260d}.hero{background:linear-gradient(135deg,#174f39,#2f7655);color:#fff}.title{font-weight:900;font-size:17px}.muted{color:var(--muted);font-size:12px}.hero .muted{color:#ffffffb0}
.row{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1}.strong{font-weight:900}.me{background:#edf5ee;margin:0 -8px;padding:10px 8px;border-radius:11px}
.btn{border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px}.primary{width:100%;background:var(--g2);color:#fff}.soft{background:#edf2ed;color:var(--g)}.danger{background:#f5e9e8;color:#8c302c}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:none;color:#6e7972;font-size:10px;min-width:58px}.bottom .on{color:var(--g);font-weight:900}.bottom .scoreNav{background:var(--g2);color:white;border-radius:50%;width:45px;height:45px;margin-top:-20px;font-size:18px}
.segment{display:flex;background:#edf1ed;border-radius:10px;padding:3px}.segment button{border:0;background:none;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:900;color:#66736b}.segment .on{background:#fff;color:var(--g);box-shadow:0 1px 5px #0001}
.headline{display:flex;align-items:center;gap:8px}.headline .segment{margin-left:auto}
.guide{height:128px;border-radius:14px;background:linear-gradient(145deg,#c7dec0,#edf0d5);position:relative;overflow:hidden;margin-top:10px}.fair{position:absolute;left:50%;top:-25px;transform:translateX(-50%) rotate(7deg);height:185px;width:85px;border-radius:45%;background:#78a96f}.green{position:absolute;right:75px;top:15px;width:38px;height:28px;border-radius:50%;background:#4d8b4a}.sand{position:absolute;right:55px;top:44px;width:22px;height:13px;border-radius:50%;background:#dfc89b}.water{position:absolute;left:22px;bottom:15px;width:65px;height:25px;border-radius:50%;background:#79a7c6}.guideTag{position:absolute;left:9px;top:8px;background:#ffffffe8;border-radius:9px;padding:5px 7px;font-weight:900;font-size:11px;z-index:2}
.player{padding:11px 0;border-bottom:1px solid var(--line)}.player:last-child{border:0}.phead{display:flex;align-items:center;gap:8px}.phead b{flex:1}.liveScore{font-size:15px;font-weight:900}
.scroller{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 4px;scroll-snap-type:x proximity}.scroller button{min-width:46px;height:45px;border:1px solid #d6ddd6;background:#fff;border-radius:12px;font-size:16px;font-weight:900;scroll-snap-align:center}.scroller .parBtn{border:2px solid var(--g2);position:relative}.scroller .parBtn:after{content:"PAR";position:absolute;bottom:2px;left:0;right:0;font-size:7px;color:var(--g2)}.scroller .sel{background:var(--g);color:#fff;border-color:var(--g)}.scroller .sel:after{color:#fff}
.notice{padding:10px;border-radius:11px;background:#f4ead8;font-size:12px}.ok{background:#e5f1e7;color:var(--g)}
.tablewrap{overflow:auto}.scoretable{border-collapse:collapse;min-width:900px;width:100%;font-size:11px}.scoretable th,.scoretable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}.scoretable th:first-child,.scoretable td:first-child{position:sticky;left:0;background:white;z-index:2;text-align:left}.latest{background:#eef6ef!important;font-weight:900}.sum{background:#f1f3ef!important;font-weight:900}
.mark{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;font-weight:900}.bird{border:2px solid var(--red);border-radius:50%;color:var(--red)}.eagle{border:4px double var(--red);border-radius:50%;color:var(--red)}.bogey{border:2px solid var(--blue);color:var(--blue)}.double{border:4px double var(--blue);color:var(--blue)}
.expand{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.chip{display:inline-block;padding:4px 7px;border-radius:10px;background:#edf2ed;color:var(--g);font-size:10px;font-weight:900}
.pop{display:none;position:fixed;z-index:50;left:50%;top:15%;transform:translateX(-50%);width:min(420px,90vw);background:white;border-radius:18px;padding:18px;box-shadow:0 20px 65px #0005}.pop.show{display:block}.pop input,.pop select{width:100%;padding:11px;border:1px solid #d9dfd8;border-radius:10px;font-size:16px;margin:6px 0}.check{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;width:100%}.check input{width:20px!important;height:20px!important;margin:2px 0!important}.check>span{min-width:0;display:block;overflow-wrap:anywhere}.unitInput{display:flex;align-items:center;border:1px solid #d9dfd8;border-radius:10px;overflow:hidden;margin:6px 0}.unitInput input{border:0!important;margin:0!important;border-radius:0!important;flex:1}.unitInput span{padding:0 12px;font-weight:900;color:var(--g)}.historyCard{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}
.medal{font-size:24px}.money{font-size:26px;font-weight:900;color:var(--g)}.linkrow{cursor:pointer;-webkit-tap-highlight-color:rgba(46,118,84,.12);touch-action:manipulation}
</style></head><body>
<div class="app"><header><div class="brand">🪙⛳ Friendly Competition</div><div class="tiny">Alpha 0.6.3 · Interaction Fix</div><div class="tabs" id="tabs"></div></header><main id="main"></main><div class="bottom" id="bottom"></div></div>
<div class="pop" id="pop"></div>
<script>
const P=[
{name:"Viktor Eklund",hcp:11.2,tee:"Gul",ch:11,ball:1},
{name:"Ola Eklund",hcp:10.7,tee:"Gul",ch:10,ball:1},
{name:"Albin Eklund",hcp:0.4,tee:"Gul",ch:-1,ball:1},
{name:"Anders Gustafsson",hcp:25.8,tee:"Röd",ch:18,ball:1}
];
const H=[[1,4,12,328],[2,5,8,467],[3,4,4,366],[4,4,14,330],[5,3,6,149],[6,4,10,280],[7,3,2,148],[8,5,16,407],[9,4,18,250],[10,4,9,345],[11,4,13,320],[12,4,7,334],[13,3,1,165],[14,5,15,505],[15,4,5,365],[16,4,3,340],[17,3,17,99],[18,4,11,357]];
const side={7:{type:"near",name:"Närmast hål",pre:"Hoppas järnet är varmt! Nu är det dags för närmast hål."},16:{type:"long",name:"Longest Drive",pre:"Damma av drivern! Nu är det dags för Longest Drive."}};
let S=JSON.parse(localStorage.fc06_scores||"null")||P.map(()=>Array(18).fill(null));
let histories=JSON.parse(localStorage.fc06_histories||"[]");
let sideRes=JSON.parse(localStorage.fc06_side||"{}");
let page=localStorage.fc06_page||"home",sub="today",hole=+(localStorage.fc06_hole||1),me=+(localStorage.fc06_me||0),metric="strokes",openPlayer=null,started=localStorage.fc06_started==="1",finished=localStorage.fc06_finished==="1",archived=localStorage.fc06_archived==="1";
function save(){localStorage.fc06_scores=JSON.stringify(S);localStorage.fc06_side=JSON.stringify(sideRes);localStorage.fc06_hole=hole;localStorage.fc06_page=page;localStorage.fc06_me=me}
function hc(pi,hi){let c=P[pi].ch,idx=H[hi][2];if(c>=0)return Math.floor(c/18)+(c%18>=idx?1:0);let give=-c;return idx>=19-give?-1:0}
function net(pi,hi){return S[pi][hi]==null?null:S[pi][hi]-hc(pi,hi)}
function sp(pi,hi){let n=net(pi,hi);if(n==null)return null,d=n-H[hi][1];return d<=-3?5:d==-2?4:d==-1?3:d==0?2:d==1?1:0}
function grossToPar(pi,through=18){let x=0;for(let h=0;h<through;h++)if(S[pi][h]!=null)x+=S[pi][h]-H[h][1];return x}
function netToPar(pi,through=18){let x=0;for(let h=0;h<through;h++){if(S[pi][h]!=null){let n=net(pi,h);x+=n-H[h][1]}}return x}
function points(pi,through=18){let x=0;for(let h=0;h<through;h++)x+=sp(pi,h)||0;return x}
function fmt(x){return x===0?"E":x>0?`+${x}`:`${x}`}
function last(){let n=0;for(let h=0;h<18;h++){if(P.every((_,i)=>S[i][h]!=null))n=h+1;else break}return n}
function ranking(){return P.map((_,i)=>i).sort((a,b)=>{let va=metric==="points"?points(a):netToPar(a),vb=metric==="points"?points(b):netToPar(b);if(va!==vb)return metric==="points"?vb-va:va-vb;return P[a].hcp-P[b].hcp})}
function value(i){return metric==="points"?`${points(i)} p`:fmt(netToPar(i))}
function tabs(){let a=page==="home"?[["today","Dagens upplägg"],["rules","Spelregler"],["players","Spelare"]]:page==="score"?[["register","Registrera"],["card","Scorekort"]]:page==="live"?[["leader","Leaderboard"],["ball","Boll"]]:page==="results"?[["final","Slutresultat"],["side","Sidotävlingar"],["swish","Swish"]]:[["more","Mer"]];if(!a.some(x=>x[0]===sub))sub=a[0][0];tabsEl.innerHTML=a.map(x=>`<button class="${sub===x[0]?'on':''}" onclick="sub='${x[0]}';render()">${x[1]}</button>`).join("")}
function nav(){bottom.innerHTML=[["home","🏆","Tävling"],["live","📊","Live"],["score","⛳","Score"],["results","🥇","Resultat"],["more","•••","Mer"]].map(x=>`<button class="${page===x[0]?'on':''} ${x[0]==='score'?'scoreNav':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function go(p){page=p;sub=p==="home"?"today":p==="score"?"register":p==="live"?"leader":p==="results"?"final":"more";save();render()}
function setMetric(m){metric=m;render()}
function setHalfMetric(m){metric=m;halftime()}
function togglePlayer(i){openPlayer=(openPlayer===i?null:i);render()}
function seg(){return `<div class="segment"><button type="button" class="${metric==='strokes'?'on':''}" onclick="setMetric('strokes')">SLAG</button><button type="button" class="${metric==='points'?'on':''}" onclick="setMetric('points')">POÄNG</button></div>`}
function guide(h){let x=H[h-1];return `<div class="guide"><div class="guideTag">Hål ${x[0]} · Par ${x[1]} · Index ${x[2]} · ${x[3]} m</div><div class="fair"></div><div class="green"></div><div class="sand"></div><div class="water"></div></div>`}
function home(){
 if(archived)return `<div class="card hero"><div class="muted">FRIENDLY COMPETITION</div><div style="font-size:26px;font-weight:900">Redo för nästa runda?</div></div><div class="card"><div class="title">Senast avslutad tävling</div><div class="row linkrow" onclick="showHistory(0)"><span class="medal">🏆</span><span class="grow"><b>Grönlund GK</b><div class="muted">Poängbogey · 18 hål · 4 spelare</div></span><b>Visa →</b></div></div><button class="btn primary" onclick="resetCurrent()">Starta ny testomgång</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="go('more')">Mina tävlingar</button>`;
 if(sub==="rules")return `<div class="card"><div class="title">Spelregler</div><div class="row"><span class="grow">Spelform</span><b>Poängbogey</b></div><div class="row"><span class="grow">Tie-break</span><b>Lägst HCP före</b></div><div class="row"><span class="grow">Insats</span><b>100 kr</b></div><div class="row"><span class="grow">Prisplatser</span><b>3</b></div><div class="row"><span class="grow">Hidden Holes</span><b>Av · endast 1 boll</b></div></div>`;
 if(sub==="players")return `<div class="card"><div class="title">Spelare</div>${P.map((p,i)=>`<div class="row ${i===me?'me':''}"><span class="grow"><b>${p.name}</b><div class="muted">HCP ${p.hcp} · ${p.tee} tee · spel-HCP ${p.ch}</div></span>${i===me?'<span class="chip">DU</span>':''}</div>`).join("")}<div class="row"><span class="grow">Testa som spelare</span><select onchange="me=+this.value;save();render()">${P.map((p,i)=>`<option value="${i}" ${i===me?'selected':''}>${p.name}</option>`).join("")}</select></div></div>`;
 return `<div class="card hero"><div class="muted">${finished?"RONDEN ÄR KLAR":started?"PÅGÅENDE ROND":"DAGENS TÄVLING"}</div><div style="font-size:27px;font-weight:900">Grönlund GK</div><div style="margin-top:5px">${started?"Hål "+hole+" väntar.":"Allt är klart för start."}</div></div>${guide(started?Math.min(hole,18):1)}<div class="card"><div class="title">Dagens upplägg</div><div class="row"><span>🎯</span><span class="grow">Poängbogey</span><b>18 hål</b></div><div class="row"><span>👥</span><span class="grow">Boll 1</span><b>4 spelare</b></div><div class="row"><span>🎯</span><span class="grow">Närmast hål</span><b>Hål 7</b></div><div class="row"><span>💥</span><span class="grow">Longest Drive</span><b>Hål 16</b></div><div class="row"><span>💰</span><span class="grow">Pott</span><b>400 kr</b></div></div><button class="btn primary" onclick="${started?"go('score')":"start()"}">${started?"Gå till score · hål "+hole:"▶ Starta tävlingen"}</button>`;
}
function start(){started=true;localStorage.fc06_started="1";go("score");if(side[1])setTimeout(()=>sideHeadsUp(1),120)}
function parSum(a,b){return H.slice(a,b).reduce((x,h)=>x+h[1],0)}
function scoreCard(pi){
 let l=last(),out=S[pi].slice(0,9).filter(x=>x!=null).reduce((a,b)=>a+b,0),inn=S[pi].slice(9).filter(x=>x!=null).reduce((a,b)=>a+b,0),tot=out+inn;
 return `<div class="expand"><div class="tablewrap"><table class="scoretable"><tr><th>Hål</th>${H.slice(0,9).map(h=>`<th class="${h[0]===l?'latest':''}">${h[0]}</th>`).join("")}<th class="sum">OUT</th>${H.slice(9).map(h=>`<th class="${h[0]===l?'latest':''}">${h[0]}</th>`).join("")}<th class="sum">IN</th><th class="sum">TOT</th></tr>
 <tr><th>Par</th>${H.slice(0,9).map(h=>`<td>${h[1]}</td>`).join("")}<td class="sum">${parSum(0,9)}</td>${H.slice(9).map(h=>`<td>${h[1]}</td>`).join("")}<td class="sum">${parSum(9,18)}</td><td class="sum">${parSum(0,18)}</td></tr>
 <tr><th>Index</th>${H.slice(0,9).map(h=>`<td>${h[2]}</td>`).join("")}<td class="sum">–</td>${H.slice(9).map(h=>`<td>${h[2]}</td>`).join("")}<td class="sum">–</td><td class="sum">–</td></tr>
 <tr><th>HCP</th>${H.slice(0,9).map((h,i)=>`<td>${hc(pi,i)}</td>`).join("")}<td class="sum">–</td>${H.slice(9).map((h,i)=>`<td>${hc(pi,i+9)}</td>`).join("")}<td class="sum">–</td><td class="sum">–</td></tr>
 <tr><th>Score</th>${H.slice(0,9).map((h,i)=>`<td>${mark(S[pi][i],h[1])}</td>`).join("")}<td class="sum">${out||"–"}</td>${H.slice(9).map((h,i)=>`<td>${mark(S[pi][i+9],h[1])}</td>`).join("")}<td class="sum">${inn||"–"}</td><td class="sum">${tot||"–"}</td></tr>
 <tr><th>Poäng</th>${H.slice(0,9).map((h,i)=>`<td>${sp(pi,i)??"–"}</td>`).join("")}<td class="sum">${pointsRange(pi,0,9)}</td>${H.slice(9).map((h,i)=>`<td>${sp(pi,i+9)??"–"}</td>`).join("")}<td class="sum">${pointsRange(pi,9,18)}</td><td class="sum">${points(pi)}</td></tr></table></div></div>`;
}
function pointsRange(pi,a,b){let x=0;for(let i=a;i<b;i++)x+=sp(pi,i)||0;return x}
function mark(s,p){if(s==null)return"–";let d=s-p,c=d<=-2?"eagle":d==-1?"bird":d==0?"":d==1?"bogey":"double";return `<span class="mark ${c}">${s}</span>`}
function scorePage(){
 if(sub==="card"){let ord=ranking();return `<div class="card"><div class="headline"><div><div class="title">Scorekort</div><div class="muted">Tryck på en spelare för att öppna dagens scorekort – även innan någon score är registrerad.</div></div>${seg()}</div>${ord.map(i=>`<div><div class="row linkrow ${i===me?'me':''}" onclick="togglePlayer(${i})"><span class="grow"><b>${P[i].name}</b>${i===me?' <span class="chip">DU</span>':''}</span><b>${value(i)}</b><span>⌄</span></div>${openPlayer===i?scoreCard(i):""}</div>`).join("")}</div>`}
 let h=H[hole-1],all=P.every((_,i)=>S[i][hole-1]!=null);
 return `${guide(hole)}<div class="card"><div class="headline"><div><div class="title">Hål ${hole}</div><div class="muted">Par ${h[1]} · Index ${h[2]} · score 1–${h[1]+5}</div></div><button class="btn soft" onclick="browse()">← Titta bakåt</button></div>${P.map((p,i)=>`<div class="player"><div class="phead"><b>${p.name}</b><span class="liveScore">${fmt(netToPar(i,hole-1))}</span>${i===me?'<span class="chip">DU</span>':''}</div><div class="muted">${hc(i,hole-1)} erhållna slag</div><div class="scroller" id="sc${i}">${Array.from({length:h[1]+5},(_,k)=>k+1).map(n=>`<button class="${n===h[1]?'parBtn':''} ${S[i][hole-1]===n?'sel':''}" data-n="${n}" onclick="pick(${i},${n})">${n}</button>`).join("")}<button onclick="manual(${i})">＋</button></div></div>`).join("")}</div><div>${all?`<div class="card ok"><b>✓ Alla spelare registrerade</b><div class="muted">Snabbkolla innan du går vidare.</div></div><button class="btn primary" onclick="confirmHole()">Bekräfta hål ${hole} →</button>`:`<button class="btn primary" disabled style="opacity:.45">Fyll i alla spelare</button>`}</div>`;
}
function centerPar(){P.forEach((_,i)=>{let sc=document.getElementById("sc"+i);if(!sc)return;let p=sc.querySelector(".parBtn");if(p)p.scrollIntoView({inline:"center",block:"nearest"})})}
function pick(i,n){S[i][hole-1]=n;save();render();if(i===me)award(n,H[hole-1][1])}
function manual(i){let v=prompt("Ange score för "+P[i].name);if(v&&!isNaN(v)&&+v>0){S[i][hole-1]=+v;save();render();if(i===me)award(+v,H[hole-1][1])}}
function award(s,p){let d=s-p;if(s===1)toast("🕳️ HOLE IN ONE!","Den där ska firas!");else if(d<=-3)toast("🔥 Albatross!","Det händer inte varje dag.");else if(d===-2)toast("🦅 Eagle!","Riktigt starkt.");else if(d===-1)toast("🐦 Birdie!","Snyggt jobbat!")}
function browse(){let l=Math.max(1,last());let v=prompt("Vilket hål vill du titta på? 1–"+l,l);if(v&&+v>=1&&+v<=l){let old=hole;hole=+v;render();toast("Tidigare hål","Du tittar nu på hål "+v+". Ändringar sparas direkt. Aktiv rond fortsätter på hål "+old+".");setTimeout(()=>{hole=old;save()},10)}}
function confirmHole(){let done=hole;if(hole<18){hole++;save();render();if(side[done]){sidePopup(done)}else if(done===9){halftime()}else if(side[hole]){sideHeadsUp(hole)}}else{finished=true;localStorage.fc06_finished="1";page="results";sub="final";save();render();if(side[done])sidePopup(done);else toast("🏁 Ronden är klar!","Kontrollera resultat och sidotävlingar innan du avslutar rundan.")}}
function toast(t,txt){pop.innerHTML=`<div class="title">${t}</div><p>${txt}</p><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt</button>`;pop.classList.add("show")}
function sideHeadsUp(h){let e=side[h];if(!e)return;toast((e.type==="near"?"🎯 ":"💥 ")+e.name+"!",e.pre)}
function halftime(){let oldMetric=metric;let ord=ranking();pop.innerHTML=`<div class="title">⛳ Halvtid – 9 hål spelade</div><p class="muted">Så här ser läget ut just nu.</p><div id="halfList">${ord.map((i,k)=>`<div class="row ${i===me?'me':''}"><b>${k+1}</b><span class="grow"><b>${P[i].name}</b>${i===me?' <span class="chip">DU</span>':''}</span><b>${value(i)}</b></div>`).join("")}</div><div class="segment" style="margin:12px 0"><button class="${metric==='strokes'?'on':''}" onclick="setHalfMetric('strokes')">SLAG</button><button class="${metric==='points'?'on':''}" onclick="setHalfMetric('points')">POÄNG</button></div><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt till hål 10 →</button>`;pop.classList.add("show")}
function sidePopup(h){let e=side[h],r=sideRes[h]||{};pop.innerHTML=`<div class="title">${e.type==="near"?"🎯":"💥"} ${e.name}</div><p><b>Vem vann?</b></p><label class="muted">Spelare</label><select id="sidePlayer"><option value="">Välj spelare</option>${P.map((p,i)=>`<option value="${i}" ${r.player==i?'selected':''}>${p.name}</option>`).join("")}</select><label class="muted">Avstånd (valfritt)</label><div class="unitInput"><input id="sideDist" inputmode="decimal" placeholder="${e.type==="near"?"t.ex. 1,42":"t.ex. 247,6"}" value="${r.dist??""}"><span>m</span></div><div class="muted">Du kan registrera vinnaren utan exakt mätning.</div><label class="check"><input id="noWinner" type="checkbox" ${r.none?'checked':''}><span><b>Ingen vinnare</b><br><span class="muted">Markera om sidotävlingen avslutades utan vinnare.</span></span></label><button class="btn primary" onclick="saveSide(${h})">Spara & fortsätt</button><button class="btn soft" style="width:100%;margin-top:7px" onclick="skipSide(${h})">Fyll i senare</button>`;pop.classList.add("show")}
function saveSide(h){let none=noWinner.checked,pl=sidePlayer.value,raw=sideDist.value.trim(),dist=raw?+raw.replace(",","."):null;if(!none&&!pl){pop.innerHTML=`<div class="title">Resultat saknas</div><p>Välj en vinnare, markera <b>Ingen vinnare</b> eller fyll i senare.</p><button class="btn primary" onclick="sidePopup(${h})">Tillbaka</button>`;return}sideRes[h]={none,player:none?null:+pl,dist:none?null:dist};save();pop.classList.remove("show")}
function skipSide(h){pop.innerHTML=`<div class="title">Resultat saknas</div><p>Ingen vinnare är registrerad för ${side[h].name}. Vill du fortsätta ändå?</p><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt ändå</button><button class="btn soft" style="width:100%;margin-top:7px" onclick="sidePopup(${h})">Tillbaka</button>`}
function live(){
 let ord=ranking(),l=last();
 return `<div class="card"><div class="headline"><div><div class="title">${sub==="ball"?"Bollens resultat":"Live leaderboard"}</div><div class="muted">Senast registrerade hål: ${l||"–"}</div></div>${seg()}</div>${ord.map((i,k)=>`<div><div class="row linkrow ${i===me?'me':''}" onclick="togglePlayer(${i})"><b>${k+1}</b><span class="grow"><b>${P[i].name}</b>${i===me?' <span class="chip">DU</span>':''}</span><span class="muted">${S[i].filter(x=>x!=null).length}/18</span><b>${value(i)}</b></div>${openPlayer===i?scoreCard(i):""}</div>`).join("")}</div>`;
}
function results(){
 let ord=ranking();
 if(sub==="side")return `<div class="card"><div class="title">Sidotävlingar</div>${Object.entries(side).map(([h,e])=>{let r=sideRes[h];return `<div class="row"><span>${e.type==="near"?"🎯":"💥"}</span><span class="grow"><b>${e.name}</b><div class="muted">Hål ${h}</div></span><b>${!r?'<span style="color:#9b6a16">⚠ Saknas</span>':r.none?"Ingen vinnare":P[r.player].name+(r.dist!=null?" · "+String(r.dist).replace(".",",")+" m":" · avstånd ej angivet")}</b><button class="btn soft" onclick="sidePopup(${h})">Ändra</button></div>`}).join("")}</div>`;
 if(sub==="swish")return `<div class="card"><div class="title">💸 Swish-förslag</div><div class="muted">Testfördelning med jämna priser. Full optimering kommer när flertelefonssynken byggs.</div><div class="row"><span class="grow">1:a pris</span><b>230 kr</b></div><div class="row"><span class="grow">2:a pris</span><b>110 kr</b></div><div class="row"><span class="grow">3:e pris</span><b>60 kr</b></div><div class="money">400 kr totalt</div></div>`;
 return `<div class="card hero"><div class="muted">${finished?"RONDEN ÄR SPELAD":"AKTUELL STÄLLNING"}</div><div style="font-size:27px;font-weight:900">Resultat</div></div><div class="card"><div class="headline"><div class="title">Slutställning</div>${seg()}</div>${ord.map((i,k)=>`<div class="row ${i===me?'me':''}"><span class="medal">${["🥇","🥈","🥉","4"][k]}</span><span class="grow"><b>${P[i].name}</b>${i===me?' <span class="chip">DU</span>':''}</span><b>${value(i)}</b></div>`).join("")}</div>${finished&&!archived?`<div class="card"><div class="title">Avsluta rundan</div><div class="muted">När rundan avslutas sparas resultatet och tävlingen flyttas till historiken.</div><button class="btn primary" style="margin-top:10px" onclick="archive()">Avsluta rundan helt</button></div>`:""}`;
}
function archive(){let ord=ranking();histories.unshift({name:"Grönlund GK",date:new Date().toLocaleDateString("sv-SE"),mode:"Poängbogey",players:P.length,ranking:ord.map(i=>({name:P[i].name,points:points(i),strokes:fmt(netToPar(i))}))});localStorage.fc06_histories=JSON.stringify(histories);archived=true;localStorage.fc06_archived="1";page="home";sub="today";save();render();toast("✓ Rundan är avslutad","Grönlund GK ligger nu sparad under Mina tävlingar.")}
function more(){return `<div class="card"><div class="title">Profil</div><div class="row"><span class="grow">Inloggad som</span><b>${P[me].name}</b></div></div><div class="card"><div class="title">Mina tävlingar</div><div class="muted">Pågående, avslutade och framtida Tourer kommer samlas här.</div>${histories.length?histories.map((x,idx)=>`<div class="historyCard linkrow" onclick="showHistory(${idx})"><b>${x.name}</b><div class="muted">${x.date} · ${x.mode} · ${x.players} spelare</div><div style="margin-top:5px"><span class="chip">Avslutad</span> <b style="float:right">Visa resultat →</b></div></div>`).join(""):'<div class="notice" style="margin-top:10px">Ingen avslutad tävling sparad ännu.</div>'}</div><div class="card"><div class="row"><span class="grow">Tourställning</span><b>Visas först i Tour-läge</b></div><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetCurrent()">Nollställ aktuell testomgång</button></div>`}
function showHistory(idx){let x=histories[idx];pop.innerHTML=`<div class="title">🏆 ${x.name}</div><p class="muted">${x.date} · ${x.mode}</p>${x.ranking.map((r,k)=>`<div class="row"><b>${k+1}</b><span class="grow">${r.name}</span><b>${r.points} p · ${r.strokes}</b></div>`).join("")}<button class="btn primary" style="margin-top:12px" onclick="pop.classList.remove('show')">Stäng</button>`;pop.classList.add("show")}
function resetCurrent(){if(!confirm("Nollställ aktuell testomgång men behåll Mina tävlingar?"))return;["fc06_scores","fc06_side","fc06_hole","fc06_page","fc06_started","fc06_finished","fc06_archived"].forEach(k=>localStorage.removeItem(k));location.reload()}
function resetAll(){if(!confirm("Nollställ hela testtävlingen inklusive historik?"))return;localStorage.clear();location.reload()}
function render(){tabs();nav();main.innerHTML=page==="home"?home():page==="score"?scorePage():page==="live"?live():page==="results"?results():more();setTimeout(centerPar,20)}
const tabsEl=document.getElementById("tabs"),main=document.getElementById("main"),bottom=document.getElementById("bottom"),pop=document.getElementById("pop");render();
</script></body></html>
