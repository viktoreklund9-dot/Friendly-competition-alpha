<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#124b35">
<title>Friendly Competition Alpha 0.7</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#124b35;--g2:#2e7654;--bg:#f3f5f0;--ink:#183126;--muted:#728078;--line:#dde5de}
*{box-sizing:border-box}body{margin:0;background:#e9eeea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);padding-bottom:76px}
header{background:linear-gradient(#124b35,#103e2e);color:white;padding:15px;position:sticky;top:0;z-index:10}
.brand{font-size:18px;font-weight:900}.sub{font-size:11px;opacity:.7;margin-top:2px}
main{padding:12px}.card{background:#fff;border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 3px 14px #1731260d}
.hero{background:linear-gradient(135deg,#174f39,#2f7655);color:#fff}.hero .muted{color:#ffffffb5}
.title{font-weight:900;font-size:18px}.muted{font-size:12px;color:var(--muted)}
.row{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1}
.btn{border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px}.primary{background:var(--g2);color:#fff;width:100%}.soft{background:#edf3ee;color:var(--g)}
input{width:100%;padding:12px;border:1px solid #d7dfd7;border-radius:11px;font-size:16px}
.playerBtn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;margin-top:8px}
.playerBtn:disabled{opacity:.42}.mine{background:#eaf4eb!important;border-color:#9cbea5!important}
.chip{display:inline-block;padding:4px 7px;border-radius:10px;background:#edf2ed;color:var(--g);font-size:10px;font-weight:900}
.status{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#a2aaa4}.dot.live{background:#35a765}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{font-size:24px;font-weight:900}
.scoreBtns{display:flex;gap:7px;overflow:auto;padding:9px 0}.scoreBtns button{min-width:48px;height:46px;border:1px solid var(--line);background:white;border-radius:12px;font-size:16px;font-weight:900}.scoreBtns .par{border:2px solid var(--g2)}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px}.bottom button{border:0;background:none;color:#6b776f;font-size:11px}.bottom .on{color:var(--g);font-weight:900}
.warn{background:#fff3da;border:1px solid #ead49b;border-radius:12px;padding:11px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">🪙⛳ Friendly Competition</div><div class="sub">Alpha 0.7 · Multi-device Preview</div></header>
<main id="main"></main>
<div class="bottom" id="bottom"></div>
</div>
<script>
const SUPABASE_URL = "https://nbwgcqwpfzpirfrmxnkz.supabase.co";
const SUPABASE_KEY = "sb_publishable_-frwAW-liQlS_aftG5Xv-Q_lmG3ng6X";
const sb = (SUPABASE_URL.startsWith("http") && !SUPABASE_KEY.startsWith("PASTE_")) ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;

const H=[[1,4,12],[2,5,8],[3,4,4],[4,4,14],[5,3,6],[6,4,10],[7,3,2],[8,5,16],[9,4,18],[10,4,9],[11,4,13],[12,4,7],[13,3,1],[14,5,15],[15,4,5],[16,4,3],[17,3,17],[18,4,11]];
let state={competition:null,players:[],scores:[],me:null,page:"home",connected:false};
let token=localStorage.fc07_token||crypto.randomUUID(); localStorage.fc07_token=token;
let joinCode=new URLSearchParams(location.search).get("game")||localStorage.fc07_game||"";
let channel=null;

function hc(ch,idx){if(ch>=0)return Math.floor(ch/18)+(ch%18>=idx?1:0);let give=-ch;return idx>=19-give?-1:0}
function scoreFor(pid,hole){let x=state.scores.find(s=>s.player_id===pid&&s.hole===hole);return x?x.strokes:null}
function stableford(p,h){let s=scoreFor(p.id,h+1);if(s==null)return null;let net=s-hc(p.course_handicap,H[h][2]);let d=net-H[h][1];return d<=-3?5:d===-2?4:d===-1?3:d===0?2:d===1?1:0}
function points(p,through=18){let x=0;for(let h=0;h<through;h++)x+=stableford(p,h)||0;return x}
function netToPar(p,through=18){let x=0;for(let h=0;h<through;h++){let s=scoreFor(p.id,h+1);if(s!=null)x+=(s-hc(p.course_handicap,H[h][2]))-H[h][1]}return x}
function fmt(x){return x===0?"E":x>0?`+${x}`:`${x}`}

async function loadGame(){
 if(!sb||!joinCode)return render();
 let {data:c}=await sb.from("competitions").select("*").eq("join_code",joinCode).maybeSingle();
 if(!c)return render();
 state.competition=c;
 let [{data:p},{data:s}]=await Promise.all([
   sb.from("players").select("*").eq("competition_id",c.id).order("sort_order"),
   sb.from("scores").select("*").eq("competition_id",c.id)
 ]);
 state.players=p||[]; state.scores=s||[];
 let myId=localStorage.fc07_player;
 state.me=state.players.find(x=>x.id===myId)||null;
 subscribe(); render();
}

function subscribe(){
 if(!sb||!state.competition)return;
 if(channel)sb.removeChannel(channel);
 channel=sb.channel("game-"+state.competition.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"scores",filter:`competition_id=eq.${state.competition.id}`},()=>loadGame())
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"competitions",filter:`id=eq.${state.competition.id}`},()=>loadGame())
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:`competition_id=eq.${state.competition.id}`},()=>loadGame())
 .subscribe(st=>{state.connected=st==="SUBSCRIBED";render()});
}

async function createTest(){
 if(!sb)return alert("Supabase är inte konfigurerat ännu.");
 let {data,error}=await sb.rpc("alpha_create_test_competition");
 if(error)return alert(error.message);
 let code=Array.isArray(data)?data[0]?.join_code:data?.join_code;
 if(!code)return alert("Kunde inte skapa tävling.");
 joinCode=code;localStorage.fc07_game=code;
 history.replaceState(null,"",`?game=${code}`);
 await loadGame();
}

async function claim(id){
 let {data,error}=await sb.rpc("alpha_claim_player",{p_join_code:joinCode,p_player_id:id,p_token:token});
 if(error||!data)return alert("Spelaren är redan vald på en annan telefon.");
 localStorage.fc07_player=id;await loadGame();
}

async function logout(){
 if(state.me)await sb.rpc("alpha_release_player",{p_join_code:joinCode,p_player_id:state.me.id,p_token:token});
 localStorage.removeItem("fc07_player");state.me=null;await loadGame();
}

async function setScore(pid,hole,strokes){
 if(!state.me)return;
 let {data,error}=await sb.rpc("alpha_set_score",{p_join_code:joinCode,p_actor_token:token,p_player_id:pid,p_hole:hole,p_strokes:strokes});
 if(error||!data)return alert("Scoren kunde inte sparas.");
}

async function nextHole(){
 let h=state.competition.current_hole;
 if(!state.players.every(p=>scoreFor(p.id,h)!=null))return;
 if(h<18)await sb.rpc("alpha_set_current_hole",{p_join_code:joinCode,p_actor_token:token,p_hole:h+1});
}

function copyInvite(){
 let u=location.origin+location.pathname+"?game="+joinCode;
 navigator.clipboard?.writeText(u);
 alert("Inbjudningslänken är kopierad.");
}

function home(){
 if(!sb)return `<div class="card hero"><div class="title">Alpha 0.7 är byggd</div><p>Klienten väntar bara på Supabase-anslutningen.</p></div><div class="warn"><b>Databas ej ansluten.</b><br>Projekt-URL och publishable key ska läggas in innan multi-device-testet.</div>`;
 if(!state.competition)return `<div class="card hero"><div class="title">Multi-device test</div><p>Skapa en gemensam testrunda och öppna samma länk på flera telefoner.</p></div><button class="btn primary" onclick="createTest()">Skapa testrunda</button>`;
 return `<div class="card hero"><div class="muted">${state.competition.status==="active"?"PÅGÅENDE ROND":"GEMENSAM TÄVLING"}</div><div class="title">${state.competition.course_name}</div><p>Hål ${state.competition.current_hole} · Poängbogey</p></div>
 <div class="card"><div class="row"><span class="grow"><b>Anslutning</b></span><span class="status"><span class="dot ${state.connected?'live':''}"></span>${state.connected?'Live':'Ansluter...'}</span></div>
 <button class="btn primary" onclick="copyInvite()">🔗 Kopiera inbjudningslänk</button></div>
 ${!state.me?identity():`<div class="card"><div class="title">Du är ${state.me.name}</div><div class="muted">Alla i bollen kan registrera allas score.</div><button class="btn soft" style="margin-top:10px" onclick="logout()">Logga ut / byt spelare</button></div>`}`;
}

function identity(){return `<div class="card"><div class="title">Vem är du?</div><div class="muted">Ett namn kan bara vara aktivt på en telefon åt gången.</div>${state.players.map(p=>`<button class="playerBtn" ${p.claimed_token?'disabled':''} onclick="claim('${p.id}')"><b>${p.name}</b><br><span class="muted">HCP ${p.hcp} · ${p.tee} tee</span>${p.claimed_token?'<span style="float:right" class="chip">UPPTAGEN</span>':''}</button>`).join("")}</div>`}

function score(){
 if(!state.competition)return home();
 if(!state.me)return identity();
 let h=state.competition.current_hole, hd=H[h-1];
 return `<div class="card hero"><div class="muted">LIVE SCORE</div><div class="title">Hål ${h} · Par ${hd[1]} · Index ${hd[2]}</div></div>
 <div class="card">${state.players.map(p=>{let cur=scoreFor(p.id,h);return `<div class="row" style="display:block"><div style="display:flex"><b class="grow">${p.name}</b><b>${fmt(netToPar(p,h-1))} · ${points(p,h-1)} p</b></div><div class="scoreBtns">${Array.from({length:hd[1]+5},(_,i)=>i+1).map(n=>`<button class="${n===hd[1]?'par':''}" onclick="setScore('${p.id}',${h},${n})">${n}</button>`).join("")}</div><div class="muted">${cur?`Registrerat: ${cur} slag`:"Ej registrerat"}</div></div>`}).join("")}</div>
 <button class="btn primary" ${state.players.every(p=>scoreFor(p.id,h)!=null)?'':'disabled style="opacity:.45"'} onclick="nextHole()">Bekräfta hål ${h} →</button>`;
}

function live(){
 if(!state.competition)return home();
 let ord=[...state.players].sort((a,b)=>points(b)-points(a)||a.hcp-b.hcp);
 return `<div class="card"><div class="title">Live leaderboard</div><div class="muted">Uppdateras mellan telefonerna.</div>${ord.map((p,i)=>`<div class="row ${state.me&&state.me.id===p.id?'mine':''}"><b>${i+1}</b><span class="grow"><b>${p.name}</b>${state.me&&state.me.id===p.id?' <span class="chip">DU</span>':''}</span><b>${points(p)} p</b></div>`).join("")}</div>`;
}

function render(){
 let m=document.getElementById("main"),b=document.getElementById("bottom");
 m.innerHTML=state.page==="home"?home():state.page==="score"?score():live();
 b.innerHTML=[["home","🏆","Tävling"],["live","📊","Live"],["score","⛳","Score"]].map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="state.page='${x[0]}';render()">${x[1]}<br>${x[2]}</button>`).join("");
}
loadGame();render();
</script>
</body></html>
