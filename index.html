<style>

main{padding:12px}.card{background:#fff;border-radius:17px;padding:14px;margin-bottom:11px;box-shadow:0 3px 14px #1731260d}.hero{background:linear-gradient(135deg,#174f39,#2f7655);color:#fff}.title{font-weight:900;font-size:17px}.muted{color:var(--muted);font-size:12px}.hero .muted{color:#ffffffb0}

.bottom{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottom button{border:0;background:none;color:#6e7972;font-size:10px;min-width:58px}.bottom .on{color:var(--g);font-weight:900}.bottom .scoreNav{background:var(--g2);color:white;border-radius:50%;width:45px;height:45px;margin-top:-20px;font-size:18px}
.segment{display:flex;background:#edf1ed;border-radius:10px;padding:3px}.segment button{border:0;background:none;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:900;color:#66736b}.segment .on{background:#fff;color:var(--g);box-shadow:0 1px 5px #0001}
.headline{display:flex;align-items:center;gap:8px}.headline .segment{margin-left:auto}.chip{display:inline-block;padding:4px 7px;border-radius:10px;background:#edf2ed;color:var(--g);font-size:10px;font-weight:900}
.guide{height:128px;border-radius:14px;background:linear-gradient(145deg,#c7dec0,#edf0d5);position:relative;overflow:hidden;margin:10px 0}.fair{position:absolute;left:50%;top:-25px;transform:translateX(-50%) rotate(7deg);height:185px;width:85px;border-radius:45%;background:#78a96f}.green{position:absolute;right:75px;top:15px;width:38px;height:28px;border-radius:50%;background:#4d8b4a}.sand{position:absolute;right:55px;top:44px;width:22px;height:13px;border-radius:50%;background:#dfc89b}.water{position:absolute;left:22px;bottom:15px;width:65px;height:25px;border-radius:50%;background:#79a7c6}.guideTag{position:absolute;left:9px;top:8px;background:#ffffffe8;border-radius:9px;padding:5px 7px;font-weight:900;font-size:11px;z-index:2}
.player{padding:11px 0;border-bottom:1px solid var(--line)}.player:last-child{border:0}.phead{display:flex;align-items:center;gap:8px}.phead b{flex:1}.liveScore{font-size:15px;font-weight:900}.scroller{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 4px}.scroller button{min-width:46px;height:45px;border:1px solid #d6ddd6;background:#fff;border-radius:12px;font-size:16px;font-weight:900}.scroller .parBtn{border:2px solid var(--g2);position:relative}.scroller .parBtn:after{content:"PAR";position:absolute;bottom:2px;left:0;right:0;font-size:7px;color:var(--g2)}.scroller .sel{background:var(--g);color:#fff;border-color:var(--g)}
.notice{padding:10px;border-radius:11px;background:#f4ead8;font-size:12px}.ok{background:#e5f1e7;color:var(--g)}.warn{background:#fff3da;border:1px solid #ead49b;border-radius:12px;padding:10px;font-size:12px}
.tablewrap{overflow:auto}.scoretable{border-collapse:collapse;min-width:900px;width:100%;font-size:11px}.scoretable th,.scoretable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}.scoretable th:first-child,.scoretable td:first-child{position:sticky;left:0;background:white;z-index:2;text-align:left}.sum{background:#f1f3ef!important;font-weight:900}

.mark:before,.mark:after{content:"";position:absolute;pointer-events:none}

.double:after,.triple:after{inset:0;border:2px solid #c34b47}

.pop{display:none;position:fixed;z-index:50;left:50%;top:14%;transform:translateX(-50%);width:min(420px,90vw);background:white;border-radius:18px;padding:18px;box-shadow:0 20px 65px #0005}.pop.show{display:block}.pop input,.pop select{width:100%;padding:11px;border:1px solid #d9dfd8;border-radius:10px;font-size:16px;margin:6px 0}.check{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:10px 0}.unitInput{display:flex;align-items:center;border:1px solid #d9dfd8;border-radius:10px;overflow:hidden;margin:6px 0}.unitInput input{border:0!important;margin:0!important}.unitInput span{padding:0 12px;font-weight:900;color:var(--g)}
.status{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#aaa}.dot.live{background:#35a765}
.linkrow{cursor:pointer;touch-action:manipulation}
.formgrid{display:grid;grid-template-columns:1fr 92px;gap:8px;margin:8px 0}.formgrid input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.formgrid .wide{grid-column:1/-1}.miniLabel{font-size:10px;font-weight:900;color:var(--muted);margin-top:8px}
.infoBtn{border:0;background:#e9efea;color:var(--g);width:21px;height:21px;border-radius:50%;font-weight:900;padding:0}
.next{border:1px solid #cfe0d2;background:#edf6ee}.kicker{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--g2)}
.roundstatus{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f3f6f2;border-radius:11px;padding:9px}.stat b{display:block;font-size:16px}
.wizardTop{margin-bottom:12px}.progress{display:flex;align-items:center;gap:4px;margin:8px 0 4px}.progress span{height:5px;flex:1;border-radius:6px;background:#dce4dd}.progress .done{background:var(--g2)}.stepMeta{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em}.choice{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px;margin:8px 0;color:var(--ink)}.choice.on{border-color:var(--g2);background:#edf6ee}.choice b{font-size:16px}.choice .muted{margin-top:4px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7ded7;border-radius:12px;padding:13px;font:inherit;background:#fff}.field textarea{min-height:84px;resize:vertical}.wizardActions{display:grid;grid-template-columns:100px 1fr;gap:8px;margin-top:14px}.wizardActions.one{grid-template-columns:1fr}.playerCard,.sideCard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}.playerGrid{display:grid;grid-template-columns:1fr 90px;gap:8px}.teeRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.teeRow button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800}.teeRow .on{background:var(--g);color:#fff}.addBtn{width:100%;border:1px dashed #aab8ad;background:#f8faf7;color:var(--g);border-radius:13px;padding:12px;font-weight:900}.badgeSoon{font-size:10px;background:#eef0ee;padding:4px 7px;border-radius:10px;color:#758079}.summaryKey{font-size:11px;color:var(--muted);font-weight:900}.summaryVal{font-size:15px;font-weight:900}.clockbar{display:flex;align-items:center;justify-content:space-between;background:#143e2f;color:#fff;border-radius:14px;padding:11px 13px;margin-bottom:10px}.clockbar b{font-size:18px}.overlay{display:none;position:fixed;inset:0;z-index:60;background:#0004;padding:14vh 18px}.overlay.show{display:block}.modal{max-width:420px;margin:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 65px #0005}
</style></head>
<body><div class="app"><header><div class="brand">🪙⛳ Friendly Competition</div><div class="tiny">Alpha 0.8.1 · Round Builder</div><div class="tabs" id="tabs"></div></header><main id="main"></main><div class="bottom" id="bottom"></div></div><div class="pop" id="pop"></div><div class="overlay" id="overlay" onclick="if(event.target===this)closeInfo()"><div class="modal" id="infoModal"></div></div>
<script>
const SUPABASE_URL="https://nbwgcqwpfzpirfrmxnkz.supabase.co";
const SUPABASE_KEY="sb_publishable_-frwAW-liQlS_aftG5Xv-Q_lmG3ng6X";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const H=[[1,4,12,328],[2,5,8,467],[3,4,4,366],[4,4,14,330],[5,3,6,149],[6,4,10,280],[7,3,2,148],[8,5,16,407],[9,4,18,250],[10,4,9,345],[11,4,13,320],[12,4,7,334],[13,3,1,165],[14,5,15,505],[15,4,5,365],[16,4,3,340],[17,3,17,99],[18,4,11,357]];
const DEFAULT_SIDE={};
let side={};
let builder=loadBuilder();
function defaultBuilder(){return {step:1,type:"",name:"",course:"Grönlund GK",players:[{name:"",hcp:"",tee:"Gul"}],mode:"stableford",sides:[]}}
function loadBuilder(){try{return {...defaultBuilder(),...JSON.parse(localStorage.fc081_builder||"{}")}}catch(e){return defaultBuilder()}}
function saveBuilder(){localStorage.fc081_builder=JSON.stringify(builder)}
function resetBuilder(){builder=defaultBuilder();saveBuilder()}
function sideFromSettings(settings){let out={};(settings?.side_competitions||[]).forEach(x=>{if(x.enabled!==false){out[+x.hole]={kind:x.kind,name:x.name,rule:x.rule||"",pre:x.kind==="nearest"?"Hoppas järnet är varmt! Nu är det dags för närmast hål!":x.kind==="longest"?"Damma av drivern! Nu är det dags för Longest Drive!":"Dags för "+x.name+"!"}}});return out}
let state={competition:null,players:[],scores:[],side:[],me:null,page:"home",sub:"today",metric:"points",openPlayer:null,connected:false};
let token=localStorage.fc07_token||crypto.randomUUID();localStorage.fc07_token=token;
let joinCode=new URLSearchParams(location.search).get("game")||localStorage.fc07_game||"";
let channel=null;

function hc(p,hi){let c=p.course_handicap,idx=H[hi][2];if(c>=0)return Math.floor(c/18)+(c%18>=idx?1:0);let give=-c;return idx>=19-give?-1:0}
function scoreFor(pid,h){let x=state.scores.find(s=>s.player_id===pid&&s.hole===h);return x?x.strokes:null}
function net(p,hi){let s=scoreFor(p.id,hi+1);return s==null?null:s-hc(p,hi)}
function sp(p,hi){let n=net(p,hi);if(n==null)return null;let d=n-H[hi][1];return d<=-3?5:d===-2?4:d===-1?3:d===0?2:d===1?1:0}
function points(p,through=18){let x=0;for(let h=0;h<through;h++)x+=sp(p,h)||0;return x}
function netToPar(p,through=18){let x=0;for(let h=0;h<through;h++){let n=net(p,h);if(n!=null)x+=n-H[h][1]}return x}
function fmt(x){return x===0?"E":x>0?`+${x}`:`${x}`}
function parseHcp(raw){let s=String(raw??"").trim().replace(",",".");if(!s)return NaN;let golfPlus=s.startsWith("+"),n=Number(s);if(!Number.isFinite(n))return NaN;return golfPlus?-Math.abs(n):n}
function hcpText(v){let n=Number(v);if(!Number.isFinite(n))return "–";let x=(Math.round(Math.abs(n)*10)/10).toFixed(1).replace(".",",");return n<0?"+"+x:x}
function playingHcp(v){let n=Number(v);return n<0?-Math.max(1,Math.round(Math.abs(n))):Math.round(n)}
function modeName(){return state.competition?.mode==="stroke"?"Slagtävling netto":"Poängbogey"}
function dur(a,b){if(!a||!b)return null;let m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")}
function elapsed(){let c=state.competition;if(!c?.started_at)return "0:00";return dur(c.started_at,c.finished_at||new Date().toISOString())}
function clockBar(){return state.competition?.started_at?`<div class="clockbar"><span>⏱ Rondtid</span><b class="liveClock">${elapsed()}</b></div>`:""}
function timeSummary(){let c=state.competition;if(!c?.started_at)return"";let f=c.halfway_at?dur(c.started_at,c.halfway_at):null,b=c.halfway_at&&c.finished_at?dur(c.halfway_at,c.finished_at):null;return `<div class="card"><div class="title">⏱ Rondtid</div><div class="row"><span class="grow">Totalt</span><b>${elapsed()}</b></div>${f?`<div class="row"><span class="grow">Första 9</span><b>${f}</b></div>`:""}${b?`<div class="row"><span class="grow">Sista 9</span><b>${b}</b></div>`:""}</div>`}
function holesPlayed(p){return state.scores.filter(s=>s.player_id===p.id).length}
function joined(){return state.players.filter(p=>p.claimed_token).length}
function ranking(){let pts=state.competition?.mode!=="stroke"&&state.metric==="points";return [...state.players].sort((a,b)=>pts?(points(b)-points(a)||a.hcp-b.hcp):(netToPar(a)-netToPar(b)||a.hcp-b.hcp))}
function val(p){return state.competition?.mode!=="stroke"&&state.metric==="points"?`${points(p)} p`:fmt(netToPar(p))}
function sideResult(h){return state.side.find(x=>x.hole===h&&x.kind===side[h]?.kind)}
function allScored(h){return state.players.every(p=>scoreFor(p.id,h)!=null)}
function hcpLabel(p,i){let x=hc(p,i);return x<0?`+${Math.abs(x)}`:`${x}`}
function birdies(p){return H.filter((x,i)=>{let s=scoreFor(p.id,i+1);return s!=null&&s<x[1]}).length}
function bogeys(p){return H.filter((x,i)=>{let s=scoreFor(p.id,i+1);return s!=null&&s>x[1]}).length}
function remainingSides(){return Object.keys(side).filter(h=>!sideResult(+h)).length}
function info(title,body){infoModal.innerHTML=`<div class="title">${title}</div><p>${body}</p>`;overlay.classList.add("show")}
function closeInfo(){overlay.classList.remove("show")}
function sideInfo(h){let e=side[h];info(e.name,e.kind==="nearest"?"Bollen måste ligga på green för att räknas. Kortast avstånd till hålet vinner. Resultatet kan fyllas i även efter avslutad rond.":"Bollen måste ligga på fairway för att räknas. Längsta godkända drive vinner. Resultatet kan fyllas i även efter avslutad rond.")}
function nextStep(){if(!state.competition)return"";if(state.competition.status==="finished")return `<div class="card next"><div class="kicker">NÄSTA STEG</div><div class="title">Ronden är avslutad</div><p class="muted">${remainingSides()?remainingSides()+" sidotävling(ar) saknar resultat.":"Alla resultat är registrerade."}</p><button class="btn primary" onclick="state.page='results';state.sub='final';render()">Visa resultat</button></div>`;if(state.competition.status==="active")return `<div class="card next"><div class="kicker">NÄSTA STEG</div><div class="title">Fortsätt hål ${state.competition.current_hole}</div><button class="btn primary" onclick="state.page='score';state.sub='register';render()">Fortsätt rond</button></div>`;return""}
function roundStatus(){if(!state.me||!state.competition||state.competition.status!=="active")return"";return `<div class="card"><div class="title">Din rondstatus</div><div class="roundstatus"><div class="stat"><span class="muted">Hål</span><b>${state.competition.current_hole}/18</b></div><div class="stat"><span class="muted">Resultat</span><b>${points(state.me)} p · ${fmt(netToPar(state.me))}</b></div><div class="stat"><span class="muted">Tagna / tappade</span><b>◯ ${birdies(state.me)} · □ ${bogeys(state.me)}</b></div><div class="stat"><span class="muted">Sidotävlingar kvar</span><b>${remainingSides()}</b></div></div></div>`}


async function reload(){
 if(!joinCode){render();return}
 let {data:c}=await sb.from("competitions").select("*").eq("join_code",joinCode).maybeSingle();if(!c){render();return}
 state.competition=c;
 let [{data:p},{data:s},{data:sr}]=await Promise.all([
  sb.from("players").select("*").eq("competition_id",c.id).order("sort_order"),
  sb.from("scores").select("*").eq("competition_id",c.id),
  sb.from("side_results").select("*").eq("competition_id",c.id)
 ]);
 state.players=p||[];state.scores=s||[];state.side=sr||[];side=sideFromSettings(c.settings);if(c.mode==="stroke")state.metric="strokes";
 state.me=state.players.find(p=>p.id===localStorage.fc07_player)||null;
 subscribe();render();
}
function subscribe(){
 if(!state.competition)return;if(channel)sb.removeChannel(channel);
 channel=sb.channel("fc-"+state.competition.id)
 .on("postgres_changes",{event:"*",schema:"public",table:"scores",filter:`competition_id=eq.${state.competition.id}`},reload)
 .on("postgres_changes",{event:"*",schema:"public",table:"side_results",filter:`competition_id=eq.${state.competition.id}`},reload)
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"players",filter:`competition_id=eq.${state.competition.id}`},reload)
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"competitions",filter:`id=eq.${state.competition.id}`},reload)
 .subscribe(x=>{state.connected=x==="SUBSCRIBED";render()});
}
function progress(){return `<div class="wizardTop"><div class="stepMeta">STEG ${builder.step} AV 6</div><div class="progress">${[1,2,3,4,5,6].map(n=>`<span class="${n<=builder.step?'done':''}"></span>`).join("")}</div></div>`}
function nextStepBuilder(n){builder.step=n;saveBuilder();render();scrollTo(0,0)}
function backBuilder(){nextStepBuilder(Math.max(1,builder.step-1))}
function setType(x){builder.type=x;saveBuilder();render()}
function syncBasic(){let n=document.getElementById("bName");if(n)builder.name=n.value;saveBuilder()}
function syncPlayers(){
 let cards=document.querySelectorAll("[data-player]");
 if(!cards.length)return;
 let arr=[];cards.forEach((el,i)=>{let name=document.getElementById("bpName"+i).value,hcp=document.getElementById("bpHcp"+i).value,tee=document.querySelector(`[data-tee="${i}"].on`)?.dataset.value||"Gul";arr.push({name,hcp,tee})});builder.players=arr;saveBuilder()
}
function addPlayer(){syncPlayers();if(builder.players.length<4)builder.players.push({name:"",hcp:"",tee:"Gul"});saveBuilder();render()}
function removePlayer(i){syncPlayers();builder.players.splice(i,1);if(!builder.players.length)builder.players=[{name:"",hcp:"",tee:"Gul"}];saveBuilder();render()}
function setTee(i,v){syncPlayers();builder.players[i].tee=v;saveBuilder();render()}
function chooseMode(m){builder.mode=m;saveBuilder();render()}
function ruleInfo(name,txt){info(name,txt)}
function addSideMenu(){pop.innerHTML=`<div class="title">Lägg till sidotävling</div><p class="muted">Välj typ. Du kan lägga till flera.</p><button class="choice" onclick="newSide('nearest')"><b>🎯 Närmast hål</b><div class="muted">Bollen måste ligga på green.</div></button><button class="choice" onclick="newSide('longest')"><b>💥 Longest Drive</b><div class="muted">Bollen måste ligga på fairway.</div></button><button class="choice" onclick="newSide('custom')"><b>✏️ Egen sidotävling</b><div class="muted">Namn och egen regel.</div></button><button class="btn soft" style="width:100%" onclick="pop.classList.remove('show')">Stäng</button>`;pop.classList.add("show")}
function newSide(kind){pop.classList.remove("show");builder.editSide={kind,name:kind==="nearest"?"Närmast hål":kind==="longest"?"Longest Drive":"",hole:kind==="nearest"?7:kind==="longest"?16:1,rule:kind==="nearest"?"Bollen måste ligga på green.":kind==="longest"?"Bollen måste ligga på fairway.":""};saveBuilder();render()}
function saveSideBuilder(){
 const x=builder.editSide;
 if(!x)return alert("Sidotävlingen kunde inte läsas. Försök igen.");
 const nameEl=document.getElementById("sideName");
 const holeEl=document.getElementById("sideHole");
 const ruleEl=document.getElementById("sideRule");
 const name=x.kind==="custom"?(nameEl?.value||"").trim():x.name;
 const hole=Number(holeEl?.value);
 const rule=(ruleEl?.value||"").trim();
 if(!name)return alert("Ge sidotävlingen ett namn.");
 if(!Number.isInteger(hole)||hole<1||hole>18)return alert("Välj ett giltigt hål.");
 builder.sides.push({kind:x.kind,name,hole,rule});
 delete builder.editSide;
 saveBuilder();
 render();
 toast("✓ Sidotävling tillagd",name+" · hål "+hole);
}
function removeSide(i){builder.sides.splice(i,1);saveBuilder();render()}
function roundBuilder(){
 let s=builder.step;
 if(s===1)return `${progress()}<div class="card hero"><div class="kicker" style="color:#fff">NY ROND</div><div style="font-size:27px;font-weight:900">Vad vill du skapa?</div><p>Välj upplägg. Du kan ändra dina val innan start.</p></div>
 <button class="choice ${builder.type==="simple"?"on":""}" onclick="setType('simple')"><b>⛳ Enkel rond</b><div class="muted">En vanlig golfrunda med score, resultat och valfria sidotävlingar.</div></button>
 <button class="choice ${builder.type==="competition"?"on":""}" onclick="setType('competition')"><b>🏆 Tävling</b><div class="muted">Tävlingsform, lagstöd och fler inställningar.</div></button>

 if(s===3)return `${progress()}<div class="card"><div class="title">Vilka spelar?</div><p class="muted">Lägg in namn, handicap och tee. Plus-HCP skrivs t.ex. +0,4.</p>${builder.players.map((p,i)=>`<div class="playerCard" data-player><div class="playerGrid"><div class="field" style="margin:0"><label>Spelare ${i+1}</label><input id="bpName${i}" value="${p.name||""}" placeholder="Namn"></div><div class="field" style="margin:0"><label>HCP</label><input id="bpHcp${i}" value="${p.hcp||""}" inputmode="text" placeholder="11,2"></div></div><div class="miniLabel">TEE</div><div class="teeRow">${["Vit","Gul","Blå","Röd"].map(v=>`<button data-tee="${i}" data-value="${v}" class="${p.tee===v?'on':''}" onclick="setTee(${i},'${v}')">${v}</button>`).join("")}</div>${builder.players.length>1?`<button class="btn soft" style="margin-top:8px" onclick="removePlayer(${i})">Ta bort</button>`:""}</div>`).join("")}${builder.players.length<4?`<button class="addBtn" onclick="addPlayer()">＋ Lägg till spelare</button>`:""}</div><div class="wizardActions"><button class="btn soft" onclick="backBuilder()">← Tillbaka</button><button class="btn primary" onclick="syncPlayers();if(!builder.players.some(p=>p.name.trim()&&Number.isFinite(parseHcp(p.hcp))))info('Spelare saknas','Lägg till minst en spelare med giltigt HCP.');else nextStepBuilder(4)">Nästa →</button></div>`;
 if(s===4)return `${progress()}<div class="card"><div class="title">Tävlingsform</div><div class="miniLabel">INDIVIDUELLT</div><button class="choice ${builder.mode==="stableford"?"on":""}" onclick="chooseMode('stableford')"><b>Poängbogey</b> <span class="chip">Spelklar</span><div class="muted">Stableford – poäng efter nettoscore på varje hål.</div></button><button class="choice ${builder.mode==="stroke"?"on":""}" onclick="chooseMode('stroke')"><b>Slagtävling netto</b> <span class="chip">Spelklar</span><div class="muted">Lägst nettoscore över ronden vinner.</div></button><button class="choice" onclick="ruleInfo('Matchspel','Spelare möts hål för hål. Flest vunna hål avgör matchen. Den här scoremotorn kommer i en senare version.')"><b>Matchspel</b> <span class="badgeSoon">Kommer snart</span></button><div class="miniLabel">LAG & PAR</div>${[["Scramble","Alla slår, laget väljer bästa boll och alla spelar vidare därifrån."],["Texas Scramble","Scramble med krav på ett visst antal utslag per spelare."],["Greensome","Båda slår ut, bästa utslaget väljs och därefter spelas vartannat slag."],["Foursome","Två spelare delar en boll och slår vartannat slag."],["Fyrboll / Four-ball","Varje spelare spelar egen boll; lagets bästa resultat räknas på hålet."],["Bästboll","Lagresultat baseras på bästa individuella resultat enligt vald poäng-/slagform."]].map(x=>`<button class="choice" onclick="ruleInfo('${x[0]}','${x[1]} Den här scoremotorn kommer i en senare version.')"><b>${x[0]}</b> <span class="badgeSoon">Kommer snart</span><div class="muted">${x[1]}</div></button>`).join("")}</div><div class="wizardActions"><button class="btn soft" onclick="backBuilder()">← Tillbaka</button><button class="btn primary" onclick="nextStepBuilder(5)">Nästa →</button></div>`;
 if(s===5){
  if(builder.editSide){let x=builder.editSide;return `${progress()}<div class="card"><div class="title">${x.kind==="custom"?"Egen sidotävling":x.name}</div>${x.kind==="custom"?`<div class="field"><label>Namn</label><input id="sideName" value="${x.name}" placeholder="t.ex. Närmast rough"></div>`:""}<div class="field"><label>Hål</label><select id="sideHole">${H.map(h=>`<option value="${h[0]}" ${+x.hole===h[0]?"selected":""}>Hål ${h[0]} · Par ${h[1]}</option>`).join("")}</select></div><div class="field"><label>Regel / information</label><textarea id="sideRule" placeholder="Beskriv vad som gäller">${x.rule||""}</textarea></div><button class="btn primary" onclick="saveSideBuilder()">Lägg till sidotävling</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="delete builder.editSide;saveBuilder();render()">Avbryt</button></div>`}
  return `${progress()}<div class="card"><div class="title">Sidotävlingar</div><p class="muted">Valfritt. Lägg bara till det ni vill spela idag.</p>${builder.sides.length?builder.sides.map((x,i)=>`<div class="sideCard"><div class="row"><span class="grow"><b>${x.kind==="nearest"?"🎯":x.kind==="longest"?"💥":"✏️"} ${x.name}</b><div class="muted">Hål ${x.hole}${x.rule?` · ${x.rule}`:""}</div></span><button class="btn soft" onclick="removeSide(${i})">Ta bort</button></div></div>`).join(""):`<div class="notice">Inga sidotävlingar tillagda.</div>`}<button class="addBtn" style="margin-top:10px" onclick="addSideMenu()">＋ Lägg till sidotävling</button></div><div class="wizardActions"><button class="btn soft" onclick="backBuilder()">← Tillbaka</button><button class="btn primary" onclick="nextStepBuilder(6)">Nästa →</button></div>`;
 }
 let valid=builder.players.filter(p=>p.name.trim()&&Number.isFinite(parseHcp(p.hcp)));
 return `${progress()}<div class="card hero"><div class="kicker" style="color:#fff">REDO</div><div style="font-size:27px;font-weight:900">${builder.name||(builder.type==="competition"?"Ny tävling":"Ny rond")}</div><div>Grönlund GK</div></div><div class="card"><div class="row"><span class="grow"><div class="summaryKey">TYP</div><div class="summaryVal">${builder.type==="competition"?"Tävling":"Enkel rond"}</div></span></div><div class="row"><span class="grow"><div class="summaryKey">SPELFORM</div><div class="summaryVal">${builder.mode==="stroke"?"Slagtävling netto":"Poängbogey"}</div></span></div><div class="row"><span class="grow"><div class="summaryKey">SPELARE</div><div class="summaryVal">${valid.length}</div></span></div>${valid.map(p=>`<div class="row"><span class="grow">${p.name}</span><b>HCP ${p.hcp} · ${p.tee}</b></div>`).join("")}<div class="row"><span class="grow"><div class="summaryKey">SIDOTÄVLINGAR</div><div class="summaryVal">${builder.sides.length}</div></span></div>${builder.sides.map(x=>`<div class="row"><span class="grow">${x.name}</span><b>Hål ${x.hole}</b></div>`).join("")}</div><div class="notice ok"><b>✓ Kontrollera upplägget</b><br>När du skapar ronden kommer du till lobbyn. Där väljer du vem du är och startar sedan ronden.</div><div class="wizardActions"><button class="btn soft" onclick="backBuilder()">← Tillbaka</button><button class="btn primary" onclick="createBuiltRound()">Skapa rond →</button></div>`;
}
async function createBuiltRound(){
 syncPlayers();
 let ps=[];
 for(let p of builder.players){if(!p.name.trim())continue;let h=parseHcp(p.hcp);if(!Number.isFinite(h)||h<-10||h>54)return alert("Kontrollera HCP för "+p.name);ps.push({name:p.name.trim(),hcp:h,tee:p.tee||"Gul",course_handicap:playingHcp(h)})}
 if(!ps.length)return alert("Lägg till minst en spelare.");
 let settings={round_type:builder.type,side_competitions:builder.sides.map(x=>({enabled:true,kind:x.kind,name:x.name,hole:+x.hole,rule:x.rule||""}))};
 let {data,error}=await sb.rpc("alpha_create_built_competition",{p_name:builder.name||"Friendly Competition",p_mode:builder.mode,p_players:ps,p_settings:settings});
 if(error)return alert("Ronden kunde inte skapas: "+error.message);
 let code=Array.isArray(data)?data[0]?.join_code:data?.join_code||data;if(!code)return alert("Ronden skapades men ingen anslutningskod returnerades.");
 joinCode=code;localStorage.fc07_game=code;localStorage.removeItem("fc07_player");resetBuilder();history.replaceState(null,"",`?game=${code}`);await reload();
}
async function editPlayers(){
 if(!state.competition||state.competition.status!=="lobby")return info("Spelarna är låsta","Namn, HCP och tee kan ändras i lobbyn innan ronden startar. Efter start låses de eftersom ändringar kan påverka handicapberäkningen.");
 let rows=state.players.map((p,i)=>`<div class="playerCard">
   <div class="playerGrid">
     <div class="field" style="margin:0"><label>Namn</label><input id="en${i}" value="${p.name}"></div>
     <div class="field" style="margin:0"><label>HCP</label><input id="eh${i}" value="${hcpText(p.hcp)}" inputmode="text"></div>
   </div>
   <div class="field" style="margin:8px 0 0"><label>Tee</label>
     <select id="et${i}">
       ${["Vit","Gul","Blå","Röd"].map(v=>`<option value="${v}" ${p.tee===v?"selected":""}>${v}</option>`).join("")}
     </select>
   </div>
 </div>`).join("");
 infoModal.innerHTML=`<div class="title">Redigera spelare</div><div class="muted">Namn, HCP och tee kan ändras fram till att ronden startas.</div>${rows}<button class="btn primary" style="width:100%;margin-top:10px" onclick="savePlayers()">Spara ändringar</button>`;overlay.classList.add("show");
}
async function savePlayers(){
 for(let i=0;i<state.players.length;i++){
   let p=state.players[i],
       name=document.getElementById("en"+i).value.trim(),
       h=parseHcp(document.getElementById("eh"+i).value),
       tee=document.getElementById("et"+i).value;
   if(!name||!Number.isFinite(h))return alert("Kontrollera namn och HCP.");
   let {data,error}=await sb.rpc("alpha_update_player_v2",{
     p_join_code:joinCode,
     p_actor_token:token,
     p_player_id:p.id,
     p_name:name,
     p_hcp:h,
     p_tee:tee,
     p_course_handicap:playingHcp(h)
   });
   if(error||!data)return alert("Kunde inte spara "+name+". Kontrollera att SQL-hotfixen är installerad och att du är ansluten som en spelare i ronden.");
 }
 closeInfo();await reload();
}
async function claim(id){let {data}=await sb.rpc("alpha_claim_player",{p_join_code:joinCode,p_player_id:id,p_token:token});if(!data)return alert("Spelaren är redan vald på en annan telefon.");localStorage.fc07_player=id;await reload()}
async function logout(){if(state.me)await sb.rpc("alpha_release_player",{p_join_code:joinCode,p_player_id:state.me.id,p_token:token});localStorage.removeItem("fc07_player");state.me=null;await reload()}
async function setScore(pid,h,strokes){if(!state.me)return;let {data,error}=await sb.rpc("alpha_set_score",{p_join_code:joinCode,p_actor_token:token,p_player_id:pid,p_hole:h,p_strokes:strokes});if(error||!data)alert("Scoren kunde inte sparas.")}
async function startCompetition(){if(!state.me)return info("Kan inte starta","Välj först vem du är i spelarlistan. Därefter kan du starta ronden.");await sb.rpc("alpha_set_current_hole",{p_join_code:joinCode,p_actor_token:token,p_hole:1});await reload();toast("⛳ Ronden är startad!","Rondklockan går nu för hela bollen. Nu kör vi!")}
async function confirmHole(){let h=state.competition.current_hole;if(!allScored(h))return;if(h===18){await sb.rpc("alpha_finish_competition",{p_join_code:joinCode,p_actor_token:token});await reload();let m=remainingSides();pop.innerHTML=`<div class="title">🏁 Ronden är klar!</div><p>Alla scorer är sparade.</p>${state.competition.started_at?`<div class="notice ok"><b>⏱ Rondtid ${elapsed()}</b>${state.competition.halfway_at?`<br>Första 9: ${dur(state.competition.started_at,state.competition.halfway_at)} · Sista 9: ${dur(state.competition.halfway_at,state.competition.finished_at)}`:""}</div>`:""}${m?`<div class="warn">⚠ ${m} sidotävling(ar) saknar resultat.</div>`:""}<button class="btn primary" style="margin-top:10px" onclick="pop.classList.remove('show');state.page='results';state.sub='final';render()">Visa resultat</button>`;pop.classList.add("show");return}
 await sb.rpc("alpha_set_current_hole",{p_join_code:joinCode,p_actor_token:token,p_hole:h+1});await reload();
 if(side[h])setTimeout(()=>sidePopup(h),150);else if(h===9)setTimeout(halftime,150);else if(side[h+1])setTimeout(()=>headsUp(h+1),150)
}
function copyInvite(){let u=location.origin+location.pathname+"?game="+joinCode;navigator.clipboard?.writeText(u);alert("Inbjudningslänken är kopierad.")}
function newRound(){resetBuilder();localStorage.removeItem("fc07_game");localStorage.removeItem("fc07_player");joinCode="";state.competition=null;state.players=[];state.scores=[];state.side=[];state.me=null;state.page="home";state.sub="today";history.replaceState(null,"",location.pathname);render()}

function guide(h){let x=H[h-1];return `<div class="guide"><div class="guideTag">Hål ${x[0]} · Par ${x[1]} · Index ${x[2]} · ${x[3]} m</div><div class="fair"></div><div class="green"></div><div class="sand"></div><div class="water"></div></div>`}
function seg(){return `<div class="segment"><button class="${state.metric==='strokes'?'on':''}" onclick="state.metric='strokes';render()">SLAG</button><button class="${state.metric==='points'?'on':''}" onclick="state.metric='points';render()">POÄNG</button></div>`}
function mark(s,p){if(s==null)return"–";let d=s-p,c=d<=-3?"albatross":d===-2?"eagle":d===-1?"bird":d===0?"":d===1?"bogey":d===2?"double":"triple";return `<span class="mark ${c}">${s}</span>`}
function scoreCard(p){let out=0,inn=0;for(let h=1;h<=9;h++)out+=scoreFor(p.id,h)||0;for(let h=10;h<=18;h++)inn+=scoreFor(p.id,h)||0;
 return `<div class="tablewrap"><table class="scoretable"><tr><th>Hål</th>${H.slice(0,9).map(x=>`<th>${x[0]}</th>`).join("")}<th class="sum">OUT</th>${H.slice(9).map(x=>`<th>${x[0]}</th>`).join("")}<th class="sum">IN</th><th class="sum">TOT</th></tr>
 <tr><th>Par</th>${H.slice(0,9).map(x=>`<td>${x[1]}</td>`).join("")}<td class="sum">36</td>${H.slice(9).map(x=>`<td>${x[1]}</td>`).join("")}<td class="sum">35</td><td class="sum">71</td></tr>
 <tr><th>Index</th>${H.slice(0,9).map(x=>`<td>${x[2]}</td>`).join("")}<td class="sum">–</td>${H.slice(9).map(x=>`<td>${x[2]}</td>`).join("")}<td class="sum">–</td><td class="sum">–</td></tr><tr><th>HCP-slag</th>${H.slice(0,9).map((x,i)=>`<td>${hcpLabel(p,i)}</td>`).join("")}<td class="sum">–</td>${H.slice(9).map((x,i)=>`<td>${hcpLabel(p,i+9)}</td>`).join("")}<td class="sum">–</td><td class="sum">–</td></tr>
 <tr><th>Score</th>${H.slice(0,9).map(x=>`<td>${mark(scoreFor(p.id,x[0]),x[1])}</td>`).join("")}<td class="sum">${out||"–"}</td>${H.slice(9).map(x=>`<td>${mark(scoreFor(p.id,x[0]),x[1])}</td>`).join("")}<td class="sum">${inn||"–"}</td><td class="sum">${out+inn||"–"}</td></tr>
 <tr><th>Poäng</th>${H.slice(0,9).map((x,i)=>`<td>${sp(p,i)??"–"}</td>`).join("")}<td class="sum">${H.slice(0,9).reduce((a,x,i)=>a+(sp(p,i)||0),0)}</td>${H.slice(9).map((x,i)=>`<td>${sp(p,i+9)??"–"}</td>`).join("")}<td class="sum">${H.slice(9).reduce((a,x,i)=>a+(sp(p,i+9)||0),0)}</td><td class="sum">${points(p)}</td></tr></table></div>`}
function togglePlayer(id){state.openPlayer=state.openPlayer===id?null:id;render()}

function identity(){return `<div class="card"><div class="title">Vem är du?</div><div class="muted">Ansluten betyder att spelaren är inne i appen.</div>${state.players.map(p=>`<button class="btn ${p.claimed_token?'soft':'primary'}" style="margin-top:8px;width:100%" ${p.claimed_token?'disabled':''} onclick="claim('${p.id}')">${p.name} · HCP ${hcpText(p.hcp)}${p.claimed_token?" · Ansluten":""}</button>`).join("")}</div>`}
function home(){
 if(!state.competition)return roundBuilder();
 let active=state.competition.status==="active",finished=state.competition.status==="finished";
 if(state.sub==="rules")return `<div class="card"><div class="title">Spelregler</div><div class="row"><span class="grow">Spelform</span><b>${modeName()}</b></div><div class="row"><span class="grow">Tie-break</span><b>Lägst HCP före</b></div>${Object.entries(side).map(([h,e])=>`<div class="row"><span class="grow">${e.name}</span><b>Hål ${h}</b></div>`).join("")||`<div class="muted">Inga sidotävlingar.</div>`}</div>`;
 return `<div class="card hero"><div class="muted">${finished?"AVSLUTAD":active?"PÅGÅENDE ROND":"LOBBY"}</div><div style="font-size:26px;font-weight:900">${state.competition.course_name}</div><div>${active?`Hål ${state.competition.current_hole}`:"Välkommen – här är dagens upplägg!"}</div></div>
 <div class="card"><div class="row"><span class="grow"><b>Liveanslutning</b></span><span class="status"><span class="dot ${state.connected?'live':''}"></span>${state.connected?"Live":"Ansluter"}</span></div>
 <div class="row"><span class="grow"><b>Inne i appen</b></span><b>${joined()} / ${state.players.length}</b></div>
 ${state.players.map(p=>`<div class="row"><span class="grow"><b>${p.name}</b><div class="muted">HCP ${hcpText(p.hcp)} · Spel-HCP ${p.course_handicap<0?`+${Math.abs(p.course_handicap)}`:p.course_handicap}</div></span><span class="chip">${p.claimed_token?"Ansluten":"Väntar"}</span></div>`).join("")}${!active&&!finished&&state.me?`<button class="btn soft" style="width:100%;margin-top:8px" onclick="editPlayers()">Redigera spelare & HCP</button>`:""}</div>
 ${!state.me?identity():`<div class="card"><b>Du är ${state.me.name}</b><div class="muted">Alla spelare kan fortfarande få score registrerad även om de inte är inne i appen.</div><button class="btn soft" style="margin-top:8px" onclick="logout()">Logga ut / byt spelare</button></div>`}
 <div class="card"><div class="title">${state.competition.name||"Dagens upplägg"}</div><div class="row"><span class="grow">${modeName()}</span><b>18 hål</b></div>${Object.entries(side).map(([h,e])=>`<div class="row"><span class="grow">${e.kind==="nearest"?"🎯":e.kind==="longest"?"💥":"✏️"} ${e.name}</span><b>Hål ${h}</b></div>`).join("")||`<div class="muted">Inga sidotävlingar.</div>`}<button class="btn primary" onclick="copyInvite()">🔗 Kopiera inbjudningslänk</button></div>
 ${!active&&!finished&&state.me?`<div class="notice ok"><b>Redo att starta</b><br>En boll behöver bara en ansluten scoreansvarig. Övriga kan ansluta senare.</div><button class="btn primary" style="margin-top:10px" onclick="startCompetition()">Starta tävling</button>`:""}
 ${active?clockBar()+nextStep()+roundStatus()+guide(state.competition.current_hole):""}
 ${finished?timeSummary()+`<button class="btn primary" onclick="state.page='results';state.sub='final';render()">Visa slutresultat</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="newRound()">Ny rond</button>`:""}`;
}
function scorePage(){
 if(!state.competition)return `<div class="card hero"><div class="muted">SCORE</div><div class="title">Ingen aktiv rond</div><p>Starta en ny rond för att registrera score.</p></div><button class="btn primary" onclick="state.page='home';state.sub='today';render()">Starta ny rond</button>`;
 if(!state.me)return identity();
 if(state.competition.status==="finished"&&state.sub!=="card")return `<div class="card hero"><div class="muted">ROND AVSLUTAD</div><div class="title">Ingen aktiv rond</div><p>Scoren är låst. Du kan fortfarande gå tillbaka och läsa scorekort och resultat.</p></div><button class="btn primary" onclick="state.sub='card';render()">Visa scorekort</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="state.page='results';state.sub='final';render()">Visa resultat</button><button class="btn soft" style="width:100%;margin-top:8px" onclick="newRound()">Starta ny rond</button>${state.me?`<div class="card"><div class="title">Behöver du rätta ett misstag?</div><div class="muted">Återöppning är en admin-/teståtgärd och kräver extra bekräftelse.</div><button class="btn danger" style="width:100%;margin-top:8px" onclick="reopenRound()">Återöppna rond</button></div>`:""}`;
 if(state.sub==="card"){let ord=ranking();return `<div class="card"><div class="headline"><div><div class="title">Scorekort</div><div class="muted">Tryck på en spelare. Scorekortet finns även innan score registrerats.</div></div>${seg()}</div>${ord.map(p=>`<div><div class="row linkrow ${state.me.id===p.id?'me':''}" onclick="togglePlayer('${p.id}')"><span class="grow"><b>${p.name}</b>${state.me.id===p.id?' <span class="chip">DU</span>':''}</span><b>${val(p)}</b><span>⌄</span></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`).join("")}</div>`}
 let h=state.competition.current_hole,hd=H[h-1];
 return `${clockBar()}${guide(h)}<div class="card"><div class="title">Registrera score</div><div class="muted">Par är markerat. Ovanligare resultat anges med +.</div>${state.players.map(p=>{let cur=scoreFor(p.id,h);return `<div class="player"><div class="phead"><b>${p.name}</b><span class="liveScore">${fmt(netToPar(p,h-1))} · ${points(p,h-1)} p</span>${state.me.id===p.id?'<span class="chip">DU</span>':''}</div><div class="scroller">${Array.from({length:hd[1]+5},(_,i)=>i+1).map(n=>`<button class="${n===hd[1]?'parBtn':''} ${cur===n?'sel':''}" onclick="setScore('${p.id}',${h},${n})">${n}</button>`).join("")}<button onclick="manual('${p.id}',${h})">＋</button></div></div>`}).join("")}</div>
 ${allScored(h)?`<div class="notice ok"><b>✓ Alla spelare registrerade</b><br>Snabbkolla innan du går vidare.</div><button class="btn primary" style="margin-top:8px" onclick="confirmHole()">Bekräfta hål ${h} →</button>`:`<button class="btn primary" onclick="info('Kan inte bekräfta hålet','Score saknas för minst en spelare. Fyll i alla scorer innan du går vidare.')" style="opacity:.55">Fyll i alla spelare</button>`}
 <div class="card"><div class="row"><span class="grow"><b>Rondalternativ</b><div class="muted">Om ronden inte kan slutföras.</div></span><button class="btn danger" onclick="abortWhole()">Avsluta rond</button></div></div>`;
}
function manual(pid,h){let v=prompt("Ange score");if(v&&!isNaN(v)&&+v>0)setScore(pid,h,+v)}
function livePage(){let ord=ranking();return `<div class="card"><div class="headline"><div><div class="title">${state.sub==="ball"?"Bollens resultat":"Live leaderboard"}</div><div class="muted">Synkas i realtid mellan telefonerna.</div></div>${seg()}</div>${ord.map((p,i)=>`<div><div class="row linkrow ${state.me&&state.me.id===p.id?'me':''}" onclick="togglePlayer('${p.id}')"><b>${i+1}</b><span class="grow"><b>${p.name}</b>${state.me&&state.me.id===p.id?' <span class="chip">DU</span>':''}<div class="muted">${holesPlayed(p)}/18 hål</div></span><b>${val(p)}</b></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`).join("")}</div>`}
function resultsPage(){
 let ord=ranking();
 if(state.sub==="side")return `<div class="card"><div class="title">Sidotävlingar</div><div class="muted">Kan kompletteras och ändras även efter avslutad rond.</div>${Object.entries(side).map(([h,e])=>{let r=sideResult(+h);return `<div class="row linkrow" onclick="sidePopup(${h})"><span class="grow"><b>${e.name} <button class="infoBtn" onclick="event.stopPropagation();sideInfo(${h})">i</button></b><div class="muted">Hål ${h} · ${r?"Tryck för att ändra":"Ej registrerad"}</div></span><b>${!r?"⚠ Saknas":r.no_winner?"Ingen vinnare":state.players.find(p=>p.id===r.player_id)?.name+(r.distance_m!=null?` · ${String(r.distance_m).replace(".",",")} m`:"")}</b></div>`}).join("")}</div>`;
 return `<div class="card hero"><div class="muted">${state.competition.status==="finished"?"SLUTRESULTAT":"AKTUELL STÄLLNING"}</div><div style="font-size:27px;font-weight:900">Resultat</div><div>${modeName()}</div></div>${state.competition.status==="finished"?timeSummary():""}<div class="card"><div class="headline"><div class="title">Ställning</div>${seg()}</div>${ord.map((p,i)=>`<div><div class="row linkrow ${state.me&&state.me.id===p.id?'me':''}" onclick="togglePlayer('${p.id}')"><span style="font-size:22px">${["🥇","🥈","🥉","4"][i]||"•"}</span><span class="grow"><b>${p.name}</b></span><b>${val(p)}</b><span>⌄</span></div>${state.openPlayer===p.id?scoreCard(p):""}</div>`).join("")}</div>`;
}
function morePage(){return `<div class="card"><div class="title">Mina tävlingar</div><div class="muted">Den här tävlingen kan återöppnas via sin länk.</div></div>${state.competition&&state.competition.status==="active"?`<div class="card"><div class="title">Rondhantering</div><div class="muted">Här avslutar du hela ronden om den inte kan slutföras.</div><button class="btn danger" style="width:100%;margin-top:10px" onclick="abortWhole()">Avsluta hela ronden</button></div>`:""}<div class="card"><div class="row"><span class="grow">Tourställning</span><b>Kommer i Tour-läge</b></div></div>`}
async function abortWhole(){if(!confirm("Avsluta hela ronden i förtid? Registrerade scorer sparas och scoreinmatningen låses."))return;await sb.rpc("alpha_finish_competition",{p_join_code:joinCode,p_actor_token:token});await reload();state.page="results";state.sub="final";render()}
async function reopenRound(){
 if(!confirm("Återöppna den avslutade ronden? Gör bara detta om ronden avslutades av misstag."))return;
 if(!confirm("Bekräfta igen: scoreinmatningen blir aktiv på nytt."))return;
 let {data,error}=await sb.rpc("alpha_reopen_competition",{p_join_code:joinCode,p_actor_token:token});
 if(error||!data)return info("Kunde inte återöppna","Ronden kunde inte återöppnas. Kontrollera att SQL-uppdateringen för 0.8.1 är installerad.");
 await reload();state.page="score";state.sub="register";render();
}

function headsUp(h){toast((side[h].kind==="nearest"?"🎯 ":"💥 ")+side[h].name,side[h].pre)}
function toast(t,txt){pop.innerHTML=`<div class="title">${t}</div><p>${txt}</p><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt</button>`;pop.classList.add("show")}
function halftime(){let ord=ranking();pop.innerHTML=`<div class="title">⛳ Halvtid – 9 hål</div>${state.competition?.started_at?`<div class="notice ok"><b>⏱ Första 9: ${state.competition.halfway_at?dur(state.competition.started_at,state.competition.halfway_at):elapsed()}</b></div>`:""}<p class="muted">Så här ser läget ut just nu.</p>${ord.map((p,i)=>`<div class="row ${state.me&&state.me.id===p.id?'me':''}"><b>${i+1}</b><span class="grow">${p.name}</span><b>${val(p)}</b></div>`).join("")}<div class="segment" style="margin:10px 0"><button class="${state.metric==='strokes'?'on':''}" onclick="state.metric='strokes';halftime()">SLAG</button><button class="${state.metric==='points'?'on':''}" onclick="state.metric='points';halftime()">POÄNG</button></div><button class="btn primary" onclick="pop.classList.remove('show')">Fortsätt till hål 10 →</button>`;pop.classList.add("show")}
function sidePopup(h){let e=side[h],r=sideResult(h)||{};pop.innerHTML=`<div class="title">${e.kind==="nearest"?"🎯":"💥"} ${e.name}</div><p><b>Vem vann?</b></p><select id="sidePlayer"><option value="">Välj spelare</option>${state.players.map(p=>`<option value="${p.id}" ${r.player_id===p.id?'selected':''}>${p.name}</option>`).join("")}</select><label class="muted">Avstånd (valfritt)</label><div class="unitInput"><input id="sideDist" inputmode="decimal" value="${r.distance_m??""}" placeholder="t.ex. 1,42"><span>m</span></div><label class="check"><input id="noWinner" type="checkbox" ${r.no_winner?'checked':''}><span><b>Ingen vinnare</b><br><span class="muted">Markera om sidotävlingen avslutades utan vinnare.</span></span></label><button class="btn primary" onclick="saveSide(${h})">Spara & fortsätt</button><button class="btn soft" style="width:100%;margin-top:7px" onclick="pop.classList.remove('show')">Fyll i senare</button>`;pop.classList.add("show")}
async function saveSide(h){let none=noWinner.checked,pid=sidePlayer.value||null,raw=sideDist.value.trim(),dist=raw?+raw.replace(",","."):null;if(!none&&!pid)return alert("Välj vinnare, Ingen vinnare eller fyll i senare.");let {data,error}=await sb.rpc("alpha_set_side_result",{p_join_code:joinCode,p_actor_token:token,p_hole:h,p_kind:side[h].kind,p_player_id:pid,p_distance_m:dist,p_no_winner:none});if(error||!data)return alert("Kunde inte spara sidotävlingen.");pop.classList.remove("show")}

function tabsRender(){
 let a=state.page==="home"?[["today","Dagens upplägg"],["rules","Spelregler"]]:state.page==="score"?[["register","Registrera"],["card","Scorekort"]]:state.page==="live"?[["leader","Leaderboard"],["ball","Boll"]]:state.page==="results"?[["final","Slutresultat"],["side","Sidotävlingar"]]:[["more","Mer"]];
 if(!a.some(x=>x[0]===state.sub))state.sub=a[0][0];
 tabs.innerHTML=a.map(x=>`<button class="${state.sub===x[0]?'on':''}" onclick="state.sub='${x[0]}';render()">${x[1]}</button>`).join("")
}
function nav(){bottom.innerHTML=[["home","🏆","Tävling"],["live","📊","Live"],["score","⛳","Score"],["results","🥇","Resultat"],["more","•••","Mer"]].map(x=>`<button class="${state.page===x[0]?'on':''} ${x[0]==='score'?'scoreNav':''}" onclick="state.page='${x[0]}';state.sub='';render()">${x[1]}<br>${x[2]}</button>`).join("")}
function render(){tabsRender();nav();main.innerHTML=state.page==="home"?home():state.page==="score"?scorePage():state.page==="live"?livePage():state.page==="results"?resultsPage():morePage()}
const main=document.getElementById("main"),bottom=document.getElementById("bottom"),tabs=document.getElementById("tabs"),pop=document.getElementById("pop"),overlay=document.getElementById("overlay"),infoModal=document.getElementById("infoModal");setInterval(()=>document.querySelectorAll(".liveClock").forEach(x=>x.textContent=elapsed()),30000);reload();render();
</script></body></html>
